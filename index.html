<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fire Circle</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .screen { position: absolute; inset: 0; }

    /* ── HOME ────────────────────────────────────────────────────────── */
    #home { background: #111; transition: opacity 0.8s ease; }
    #home.fade-out { opacity: 0; pointer-events: none; }

    #orbit-ring {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      border: 2px dashed #666;
      border-radius: 50%;
    }

    #center {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: transparent;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      z-index: 4;
    }
    #fire-canvas {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
    }

    #avatars {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }
    .avatar {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translate(-50%, -50%);
      pointer-events: all;
    }
    .avatar-circle { background: #2a2a2a; border-radius: 50%; border: 2px solid #666; }
    .avatar-label  { margin-top: 6px; color: #888; font-family: sans-serif; white-space: nowrap; }

    .avatar-circle.me {
      border: 2px solid rgba(255,200,80,.7);
      box-shadow: 0 0 10px 4px rgba(255,160,40,.45), 0 0 22px 8px rgba(255,100,20,.2);
      cursor: pointer;
      animation: me-pulse 3s ease-in-out infinite;
    }
    @keyframes me-pulse {
      0%, 100% { box-shadow: 0 0 10px 4px rgba(255,160,40,.45), 0 0 22px 8px rgba(255,100,20,.2); }
      50%       { box-shadow: 0 0 16px 7px rgba(255,180,60,.65), 0 0 34px 14px rgba(255,120,30,.3); }
    }

    /* ── COMMUNITY PAGE ──────────────────────────────────────────────── */
    #compass {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #111;
      align-items: center;
      justify-content: center;
    }
    #compass.open { display: flex; }

    #compass-forest-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
    #compass-outer-ring {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px solid rgba(80,140,60,.28);
      box-shadow: 0 0 0 1px rgba(80,140,60,.08), inset 0 0 0 1px rgba(80,140,60,.08);
      pointer-events: none;
      z-index: 2;
    }
    #compass-outer-tap {
      position: absolute;
      inset: 0;
      cursor: default;
      z-index: 2;
    }
    #compass-outer-tap.forest-hover { cursor: pointer; }
    #compass-level {
      position: absolute;
      top: 18px; left: 50%; transform: translateX(-50%);
      color: rgba(176,112,64,.22);
      font-size: 9px; letter-spacing: .22em; text-transform: uppercase;
      pointer-events: none; white-space: nowrap; z-index: 10;
    }
    #compass-close {
      position: absolute;
      top: 24px; right: 28px;
      color: rgba(176,112,64,.35);
      font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
      cursor: pointer; z-index: 10; transition: color 0.2s;
    }
    #compass-close:hover { color: rgba(176,112,64,.7); }

    #compass-ring {
      position: relative;
      border-radius: 50%;
      z-index: 3;
    }

    .compass-point {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      transform: translate(-50%, -50%);
      cursor: pointer;
    }
    .compass-point-circle {
      border-radius: 50%;
      background: rgba(40,18,4,.9);
      border: 1px solid rgba(176,112,64,.3);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .compass-point:hover .compass-point-circle {
      border-color: rgba(255,180,60,.6);
      box-shadow: 0 0 14px 4px rgba(255,140,30,.25);
    }
    .compass-point-label {
      color: #b07040;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
    }
    .compass-point-icon {
      font-size: 22px;
      line-height: 1;
    }

    /* Innerwork — heart center */
    #compass-center {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      z-index: 2;
    }
    #compass-center-circle {
      border-radius: 50%;
      background: rgba(40,8,8,.95);
      border: 1px solid rgba(220,80,80,.35);
      box-shadow: 0 0 20px 6px rgba(200,50,50,.2), 0 0 50px 18px rgba(180,30,30,.1);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: box-shadow 0.2s;
    }
    #compass-center:hover #compass-center-circle {
      box-shadow: 0 0 28px 10px rgba(220,60,60,.35), 0 0 60px 24px rgba(200,40,40,.2);
    }
    #compass-heart { color: #e05555; }

    /* Dashed orbit ring — mirrors the home screen */
    #compass-orbit {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      border: 1px dashed rgba(176,112,64,.22);
      border-radius: 50%;
      pointer-events: none;
    }

    @keyframes starPulse {
      0%, 100% { transform: scale(1) rotate(0deg);   opacity: .85; }
      50%       { transform: scale(1.18) rotate(15deg); opacity: 1;   }
    }

    /* Beating heart */
    @keyframes heartbeat {
      0%   { transform: scale(1);    }
      14%  { transform: scale(1.18); }
      28%  { transform: scale(1);    }
      42%  { transform: scale(1.12); }
      56%  { transform: scale(1);    }
      100% { transform: scale(1);    }
    }
    #compass-heart {
      display: inline-block;
      animation: heartbeat 2.2s ease-in-out infinite;
      transform-origin: center;
    }

    #compass-close {
      position: absolute;
      top: 28px; right: 28px;
      color: rgba(176,112,64,.4);
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
      z-index: 10;
      transition: color 0.2s;
    }
    #compass-close:hover { color: rgba(176,112,64,.8); }

    /* ── FIRE LOGS (home screen) ────────────────────────────────────── */
    #fire-logs {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 6;
    }
    .fire-log {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      transform: translate(-50%, -50%);
      cursor: pointer;
      pointer-events: all;
    }
    .fire-log-dot {
      border-radius: 50%;
      background: rgba(60,25,5,.9);
      border: 1px solid rgba(176,112,64,.25);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .fire-log:hover .fire-log-dot {
      border-color: rgba(255,160,50,.5);
      box-shadow: 0 0 10px 3px rgba(255,100,20,.2);
    }
    .fire-log-label {
      color: rgba(176,112,64,.45);
      font-size: 9px;
      letter-spacing: .16em;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      transition: color 0.2s;
    }
    .fire-log:hover .fire-log-label { color: rgba(200,130,60,.75); }

    /* ── HOME PANEL (fire logs) ──────────────────────────────────────── */
    #home-panel {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(180deg, rgba(16,5,2,.97) 0%, rgba(8,2,1,.99) 100%);
      border-top: 1px solid rgba(176,112,64,.2);
      border-radius: 20px 20px 0 0;
      padding: 20px 24px 44px;
      z-index: 10;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
      max-height: 72vh;
      overflow-y: auto;
    }
    /* ── OUTER RING (home screen) ────────────────────────────────────── */
    #outer-ring {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px solid rgba(80,140,60,.28);
      box-shadow: 0 0 0 1px rgba(80,140,60,.08), inset 0 0 0 1px rgba(80,140,60,.08);
      pointer-events: none;
      z-index: 1;
    }
    #forest-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
    #outer-tap {
      position: absolute;
      inset: 0;
      cursor: default;
      z-index: 1;
    }
    #outer-tap.forest-hover { cursor: pointer; }

    /* ── DISCOVERY / GLOBAL ─────────────────────────────────────────── */
    #discovery {
      background: #070715;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
      z-index: 60;
    }
    #discovery.visible { opacity: 1; pointer-events: all; }

    #disc-canvas { position: absolute; inset: 0; pointer-events: none; }
    #disc-content { position: absolute; inset: 0; }

    .comm-fire {
      position: absolute;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      transition: transform 0.2s, opacity 0.3s;
    }
    .comm-fire:hover { transform: translate(-50%, -50%) scale(1.3); }
    .comm-fire.dimmed { opacity: 0.12; pointer-events: none; }

    .comm-label {
      position: absolute;
      text-align: center;
      pointer-events: none;
      color: rgba(176,112,64,.5);
      font-size: 10px;
      letter-spacing: 0.08em;
      transform: translateX(-50%);
      white-space: nowrap;
      transition: opacity 0.3s;
    }
    .comm-label.mine { color: rgba(255,180,80,.8); font-size: 11px; }
    .comm-label.dimmed { opacity: 0.1; }

    #disc-filter {
      position: absolute;
      bottom: 32px; left: 0; right: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 0 12px;
      flex-wrap: wrap;
    }
    .disc-pill {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(176,112,64,.2);
      color: rgba(176,112,64,.4);
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      cursor: pointer;
      background: transparent;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .disc-pill.active {
      border-color: rgba(176,112,64,.55);
      color: #b07040;
      background: rgba(176,112,64,.08);
    }
    #disc-close { display: none; }
    #disc-level {
      position: absolute;
      top: 18px; left: 50%; transform: translateX(-50%);
      color: rgba(176,112,64,.22);
      font-size: 9px;
      letter-spacing: .22em;
      text-transform: uppercase;
      pointer-events: none;
      white-space: nowrap;
    }
    #disc-panel {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(180deg, rgba(16,5,2,.97), rgba(8,2,1,.99));
      border-top: 1px solid rgba(176,112,64,.2);
      border-radius: 20px 20px 0 0;
      padding: 20px 24px 40px;
      z-index: 20;
      transform: translateY(100%);
      transition: transform .35s cubic-bezier(.25,.46,.45,.94);
    }
  </style>
</head>
<body>

<!-- HOME SCREEN -->
<div id="home" class="screen">
  <canvas id="forest-canvas"></canvas>
  <div id="outer-tap"></div>
  <div id="outer-ring"></div>
  <div id="orbit-ring"></div>
  <div id="center"></div>
  <div id="fire-logs"></div>
  <div id="avatars"></div>
  <div id="home-mission" style="position:absolute;bottom:32px;left:50%;transform:translateX(-50%);color:rgba(176,112,64,.18);font-size:11px;font-style:italic;font-weight:300;letter-spacing:.06em;white-space:nowrap;pointer-events:none;z-index:2;">Healing the world by building community</div>
  <div id="home-panel"></div>
</div>


<!-- DISCOVERY SCREEN -->
<div id="discovery" class="screen">
  <canvas id="disc-forest-canvas" style="position:absolute;inset:0;pointer-events:none;z-index:1;"></canvas>
  <div id="disc-outer-tap" style="position:absolute;inset:0;cursor:default;z-index:2;"></div>
  <div id="disc-outer-ring" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;border:2px solid rgba(80,140,60,.28);box-shadow:0 0 0 1px rgba(80,140,60,.08),inset 0 0 0 1px rgba(80,140,60,.08);pointer-events:none;z-index:2;"></div>
  <div id="disc-level" style="position:absolute;top:18px;left:50%;transform:translateX(-50%);color:rgba(60,120,220,.22);font-size:9px;letter-spacing:.22em;text-transform:uppercase;pointer-events:none;white-space:nowrap;z-index:10;">Global</div>
  <div id="disc-close" style="position:absolute;top:24px;right:28px;color:rgba(176,112,64,.35);font-size:11px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;z-index:10;transition:color .2s;">← Cosmic</div>
  <canvas id="disc-canvas" style="position:absolute;inset:0;pointer-events:none;z-index:3;"></canvas>
  <div id="disc-content" style="position:absolute;inset:0;z-index:4;"></div>
  <div id="disc-filter" style="z-index:10;"></div>
  <div id="disc-panel" style="z-index:20;"></div>
</div>

<!-- INTENTION PAGE -->
<div id="innerwork" class="screen" style="background:#111;opacity:0;pointer-events:none;transition:opacity .6s ease;display:flex;align-items:center;justify-content:center;z-index:50;">
  <canvas id="iw-forest-canvas" style="position:absolute;inset:0;pointer-events:none;z-index:1;"></canvas>
  <div id="iw-outer-tap" style="position:absolute;inset:0;cursor:default;z-index:2;"></div>
  <div id="iw-outer-ring" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;border:2px solid rgba(80,140,60,.28);box-shadow:0 0 0 1px rgba(80,140,60,.08),inset 0 0 0 1px rgba(80,140,60,.08);pointer-events:none;z-index:2;"></div>
  <div style="position:absolute;top:18px;left:50%;transform:translateX(-50%);color:rgba(176,112,64,.22);font-size:9px;letter-spacing:.22em;text-transform:uppercase;pointer-events:none;white-space:nowrap;z-index:10;">Intention</div>
  <div id="iw-close" style="position:absolute;top:24px;right:28px;color:rgba(176,112,64,.35);font-size:11px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;z-index:10;transition:color .2s;">← Ohana</div>
  <div id="iw-ring" style="position:relative;border-radius:50%;z-index:3;"></div>
  <div id="iw-panel" style="position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,rgba(16,5,2,.97),rgba(8,2,1,.99));border-top:1px solid rgba(176,112,64,.2);border-radius:20px 20px 0 0;padding:20px 24px 44px;z-index:20;transform:translateY(100%);transition:transform .35s cubic-bezier(.25,.46,.45,.94);max-height:72vh;overflow-y:auto;"></div>
</div>

<!-- COSMIC PAGE -->
<div id="cosmic" class="screen" style="background:#070715;opacity:0;pointer-events:none;transition:opacity .6s ease;display:flex;align-items:center;justify-content:center;z-index:55;">
  <canvas id="cosmic-forest-canvas" style="position:absolute;inset:0;pointer-events:none;z-index:1;"></canvas>
  <div id="cosmic-outer-tap" style="position:absolute;inset:0;cursor:default;z-index:2;"></div>
  <div id="cosmic-outer-ring" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;border:2px solid rgba(80,140,60,.28);box-shadow:0 0 0 1px rgba(80,140,60,.08),inset 0 0 0 1px rgba(80,140,60,.08);pointer-events:none;z-index:2;"></div>
  <div style="position:absolute;top:18px;left:50%;transform:translateX(-50%);color:rgba(100,120,255,.22);font-size:9px;letter-spacing:.22em;text-transform:uppercase;pointer-events:none;white-space:nowrap;z-index:10;">Connect</div>
  <div id="cosmic-close" style="position:absolute;top:24px;right:28px;color:rgba(176,112,64,.35);font-size:11px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;z-index:10;transition:color .2s;">← Aloha</div>
  <div id="cosmic-ring" style="position:relative;border-radius:50%;z-index:3;"></div>
  <div id="cosmic-panel" style="position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,rgba(16,5,2,.97),rgba(8,2,1,.99));border-top:1px solid rgba(176,112,64,.2);border-radius:20px 20px 0 0;padding:20px 24px 44px;z-index:20;transform:translateY(100%);transition:transform .35s cubic-bezier(.25,.46,.45,.94);"></div>
</div>

<!-- COMMUNITY PAGE -->
<div id="compass">
  <canvas id="compass-forest-canvas"></canvas>
  <div id="compass-outer-tap"></div>
  <div id="compass-outer-ring"></div>
  <div id="compass-level">My Communities</div>
  <div id="compass-close">← Ohana</div>
  <div id="compass-ring">
    <div id="compass-orbit"></div>
    <div id="compass-center">
      <div id="compass-center-circle">
        <span id="compass-heart" class="compass-point-icon">♥</span>
      </div>
    </div>
  </div>
</div>

  // ── FOREST RING ───────────────────────────────────────────────────────
  function drawForestOn(canvasId, outerR, cx, cy) {
    const canvas = document.getElementById(canvasId);
    canvas.width  = innerWidth;
    canvas.height = innerHeight;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, innerWidth, innerHeight);

    const treeCount = Math.round(outerR * 0.38);
    const treeH     = outerR * 0.22;   // tree height relative to ring radius
    const treeW     = treeH * 0.52;
    const trunkH    = treeH * 0.28;
    const trunkW    = treeW * 0.18;

    for (let i = 0; i < treeCount; i++) {
      // Spread trees slightly randomly around the ring
      const baseAngle = (2 * Math.PI / treeCount) * i;
      const jitter    = (Math.random() - 0.5) * (2 * Math.PI / treeCount) * 0.6;
      const angle     = baseAngle + jitter;

      // Vary distance slightly so trees feel organic, not mechanical
      const r   = outerR + treeH * (0.12 + Math.random() * 0.32);
      const tx  = cx + Math.cos(angle) * r;
      const ty  = cy + Math.sin(angle) * r;

      // Vary size slightly per tree
      const scale = 0.72 + Math.random() * 0.56;
      const th    = treeH * scale;
      const tw    = treeW * scale;
      const trH   = trunkH * scale;
      const trW   = trunkW * scale;

      // Depth cue — trees further from fire glow slightly dimmer
      const alpha = 0.18 + Math.random() * 0.22;

      ctx.save();
      ctx.translate(tx, ty);
      ctx.rotate(angle + Math.PI / 2); // roots face outward from center

      // Trunk
      ctx.fillStyle = `rgba(60,30,8,${alpha * 0.9})`;
      ctx.fillRect(-trW / 2, 0, trW, trH);

      // Three stacked triangles (classic pine silhouette)
      const layers = 3;
      for (let l = 0; l < layers; l++) {
        const lScale  = 1 - l * 0.22;
        const lW      = tw * lScale;
        const lH      = th * 0.42 * lScale;
        const lY      = trH + (th * 0.18 * l) - lH * 0.15;
        const fireGlow = l === 0 ? alpha * 0.15 : 0; // bottom layer catches faint orange

        // Pine canopy — dark green with faint amber base glow
        ctx.beginPath();
        ctx.moveTo(0, -(lY + lH));
        ctx.lineTo(-lW / 2, -lY);
        ctx.lineTo(lW / 2,  -lY);
        ctx.closePath();
        ctx.fillStyle = `rgba(${30 + Math.round(fireGlow * 200)},${55 + Math.round(l * 8)},${18},${alpha})`;
        ctx.fill();

        // Subtle edge highlight
        ctx.strokeStyle = `rgba(80,${140 + l * 10},50,${alpha * 0.4})`;
        ctx.lineWidth   = 0.5;
        ctx.stroke();
      }

      ctx.restore();
    }

    // Soft ambient glow just inside the tree ring — fire light on the forest floor
    const grad = ctx.createRadialGradient(cx, cy, outerR * 0.82, cx, cy, outerR * 1.18);
    grad.addColorStop(0,   'rgba(255,100,20,0.00)');
    grad.addColorStop(0.4, 'rgba(255,80,15,0.045)');
    grad.addColorStop(1,   'rgba(255,60,10,0.00)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, innerWidth, innerHeight);
  }

  // ── HOME LAYOUT ───────────────────────────────────────────────────────
  function layout() {
    const vmin     = Math.min(innerWidth, innerHeight);
    const ringDiam = vmin * 2 / 3;
    const ringR    = ringDiam / 2;
    const aSize    = ringDiam / 6;
    const fSize    = Math.max(10, aSize * 0.28);
    const cx = innerWidth / 2, cy = innerHeight / 2;

    const ring = document.getElementById('orbit-ring');
    ring.style.width = ring.style.height = ringDiam + 'px';

    // Outer ring + tap zone
    const outerDiam = ringDiam * 1.58;
    document.getElementById('outer-ring').style.width =
    document.getElementById('outer-ring').style.height = outerDiam + 'px';

    // Full-screen tap area — only fires if click lands outside the outer ring
    const outerTap = document.getElementById('outer-tap');
    const outerR = outerDiam / 2;
    outerTap.onmousemove = e => {
      const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
      outerTap.classList.toggle('forest-hover', dist > outerR);
    };
    outerTap.onmouseleave = () => outerTap.classList.remove('forest-hover');
    outerTap.onclick = e => {
      const panel = document.getElementById('home-panel');
      const panelOpen = panel.style.transform === 'translateY(0px)' || panel.style.transform === 'translateY(0)';
      const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
      if (panelOpen) {
        panel.style.transform = 'translateY(100%)';
      } else if (dist > outerR) {
        transitionToDiscovery();
      }
    };

    drawForestOn('forest-canvas', outerDiam / 2, cx, cy);

    const center = document.getElementById('center');
    const cs = aSize * 2.4;
    center.style.width = center.style.height = cs + 'px';
    center.onclick = e => { e.stopPropagation(); }; // fire is ambient — logs are the nav
    initFireCanvas(Math.round(cs));
    buildFireLogs(cx, cy, cs);

    const container = document.getElementById('avatars');
    container.innerHTML = '';
    USERS.forEach((user, i) => {
      const angle = -Math.PI / 2 + (2 * Math.PI / USERS.length) * i;
      const x = cx + ringR * Math.cos(angle), y = cy + ringR * Math.sin(angle);

      const wrap = document.createElement('div');
      wrap.className = 'avatar';
      wrap.style.left = x + 'px'; wrap.style.top = y + 'px';

      const circle = document.createElement('div');
      circle.className = 'avatar-circle' + (user.isMe ? ' me' : '');
      circle.style.cssText = `width:${aSize}px;height:${aSize}px;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;`;
      circle.innerHTML = makeAvatarSvg(user, aSize);
      circle.onclick = e => { e.stopPropagation(); openCompass(user); };

      const label = document.createElement('div');
      label.className = 'avatar-label';
      label.style.fontSize = fSize + 'px';
      label.textContent = user.name;

      wrap.addEventListener('click', e => e.stopPropagation());
      wrap.appendChild(circle);
      wrap.appendChild(label);
      container.appendChild(wrap);
    });
  }

  // Check if any event is within 24h
  function hasUpcomingEvent() {
    const now = new Date();
    return EVENTS.some(ev => {
      const d = new Date(`${ev.month} ${ev.day} ${now.getFullYear()}`);
      return d - now >= 0 && d - now < 86400000;
    });
  }

  // ── FIRE CANVAS ───────────────────────────────────────────────────────
  let fireRAF = null;

  function initFireCanvas(fireSize) {
    const sz = Math.round(fireSize * 3.2);
    let canvas = document.getElementById('fire-canvas');
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'fire-canvas';
      document.getElementById('home').appendChild(canvas);
    }
    // Clear any old content from #center (previous emoji / canvas)
    const center = document.getElementById('center');
    center.innerHTML = '';

    canvas.width = canvas.height = sz;
    canvas.style.width = canvas.style.height = sz + 'px';

    if (fireRAF) cancelAnimationFrame(fireRAF);
    animateFire(canvas, fireSize);
  }

  function animateFire(canvas, fireSize) {
    const ctx = canvas.getContext('2d');
    const sz  = canvas.width;
    const cx  = sz / 2;
    const cy  = sz / 2;
    const r   = fireSize / 2;

    // Gentle turbulence — only two slow harmonics
    function turb(t, seed) {
      return Math.sin(t * 0.52 + seed)        * 1.0
           + Math.sin(t * 0.97 + seed * 1.31) * 0.45;
    }

    function roundedRect(x, y, w, h, rad) {
      ctx.beginPath();
      ctx.moveTo(x + rad, y);
      ctx.lineTo(x + w - rad, y);
      ctx.arcTo(x + w, y,     x + w, y + h, rad);
      ctx.lineTo(x + w, y + h - rad);
      ctx.arcTo(x + w, y + h, x,     y + h, rad);
      ctx.lineTo(x + rad, y + h);
      ctx.arcTo(x,     y + h, x,     y,     rad);
      ctx.lineTo(x, y + rad);
      ctx.arcTo(x,     y,     x + w, y,     rad);
      ctx.closePath();
    }

    function drawFlame(t, offX, width, height, colors, seed, wind) {
      const wob  = turb(t, seed)        * r * 0.045;
      const wobT = turb(t, seed + 1.57) * r * 0.07;
      const wBase = wind * r * 0.025;
      const wTip  = wind * r * 0.10;

      const baseY = cy + r * 0.38;
      const tipY  = baseY - height;
      const tipX  = cx + offX + wobT + wTip;
      const midY  = baseY - height * 0.52;
      const midX  = cx + offX + wob + wBase;
      const lx    = cx - width + offX + wob + wBase;
      const rx    = cx + width + offX + wob + wBase;

      ctx.beginPath();
      ctx.moveTo(lx, baseY);
      ctx.quadraticCurveTo(midX - width * 0.5, midY, tipX, tipY);
      ctx.quadraticCurveTo(midX + width * 0.5, midY, rx,   baseY);
      ctx.closePath();

      const grad = ctx.createLinearGradient(cx + offX, baseY, tipX, tipY);
      colors.forEach(([stop, col]) => grad.addColorStop(stop, col));
      ctx.fillStyle = grad;
      ctx.fill();
    }

    function drawFrame() {
      try {
        ctx.clearRect(0, 0, sz, sz);
        const t = performance.now() / 1000;

        // Community state affects fire character
        const eventGlow  = hasUpcomingEvent() ? 1.0 : 0.0;   // brighter, taller
        const chatFlicker = chatRecentlyActive ? 1.0 : 0.0;   // more turbulence

        // Wind — more restless when chat is active
        const windBase = Math.sin(t * 0.18) * 0.28 + Math.sin(t * 0.43) * 0.14;
        const wind = windBase * (1 + chatFlicker * 0.6);

        // ── Clip logs/embers to fire circle, flames rise freely above ──
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.clip();

        // Logs
        const logY = cy + r * 0.50, logH = r * 0.16;
        ctx.save();
        ctx.translate(cx - r * 0.12, logY); ctx.rotate(-0.32);
        const lg1 = ctx.createLinearGradient(0, -logH/2, 0, logH/2);
        lg1.addColorStop(0, '#5c3010'); lg1.addColorStop(1, '#2a1206');
        ctx.fillStyle = lg1;
        roundedRect(-r * 0.36, -logH/2, r * 0.72, logH, 4); ctx.fill();
        ctx.restore();
        ctx.save();
        ctx.translate(cx + r * 0.12, logY); ctx.rotate(0.32);
        const lg2 = ctx.createLinearGradient(0, -logH/2, 0, logH/2);
        lg2.addColorStop(0, '#4e2a0e'); lg2.addColorStop(1, '#1e0d04');
        ctx.fillStyle = lg2;
        roundedRect(-r * 0.36, -logH/2, r * 0.72, logH, 4); ctx.fill();
        ctx.restore();

        // Ember glow — slow, soft pulse
        const ep = 0.28 + 0.08 * Math.sin(t * 1.8 + turb(t, 5) * 0.4);
        const eg = ctx.createRadialGradient(cx, logY - logH * 0.3, 0, cx, logY, r * 0.48);
        eg.addColorStop(0, `rgba(255,120,10,${ep})`);
        eg.addColorStop(1, 'rgba(255,50,0,0)');
        ctx.fillStyle = eg;
        ctx.beginPath(); ctx.ellipse(cx, logY, r * 0.46, r * 0.22, 0, 0, Math.PI * 2); ctx.fill();

        ctx.restore(); // end base clip — flames draw freely above

        // Community state scales flame height and opacity
        const fh = 1 + eventGlow * 0.28; // taller when event is upcoming
        const fo = 1 + eventGlow * 0.18; // brighter

        // Outer flame body — warm amber, fairly transparent
        drawFlame(t, 0,     r*.32, r*1.40*fh, [[0,`rgba(180,55,0,${.55*fo})`],[.55,`rgba(220,90,10,${.30*fo})`],[1,'rgba(255,140,20,0)']], 0.0,  wind);
        drawFlame(t,-r*.09, r*.24, r*1.18*fh, [[0,`rgba(190,60,0,${.48*fo})`],[.60,`rgba(225,95,10,${.25*fo})`],[1,'rgba(255,145,20,0)']], 1.73, wind);
        drawFlame(t, r*.08, r*.22, r*1.10*fh, [[0,`rgba(185,58,0,${.45*fo})`],[.65,`rgba(218,88,8,${.22*fo})`],[1,'rgba(255,140,18,0)']], 3.07, wind);
        // Inner warm core
        drawFlame(t, 0,     r*.20, r*1.00*fh, [[0,`rgba(255,140,20,${.70*fo})`],[.45,`rgba(255,180,40,${.45*fo})`],[1,'rgba(255,220,80,0)']], 0.9, wind);
        // Bright tip
        drawFlame(t, 0,     r*.10, r*.70*fh,  [[0,`rgba(255,210,90,${.80*fo})`],[.50,`rgba(255,190,55,${.40*fo})`],[1,'rgba(255,240,160,0)']], 2.1, wind);

        // Soft ambient glow — warmer when event upcoming
        const glowA = (0.038 + eventGlow * 0.028) + 0.012 * Math.sin(t * 1.4);
        const glow  = ctx.createRadialGradient(cx, cy + r * 0.1, r * 0.2, cx, cy, r * 1.4);
        glow.addColorStop(0,   'rgba(255,100,20,0)');
        glow.addColorStop(0.5, `rgba(255,80,15,${glowA})`);
        glow.addColorStop(1,   'rgba(255,40,0,0)');
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(cx, cy, r * 1.4, 0, Math.PI * 2); ctx.fill();

      } catch(e) { console.error('fire draw error:', e); }
      fireRAF = requestAnimationFrame(drawFrame);
    }

    drawFrame();
  }

  // ── COMPASS ───────────────────────────────────────────────────────────
  let compassUser = null;

  function makeAvatarSvg(user, size) {
    if (user.avatar === 'snoopy') {
      return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="28" cy="38" rx="18" ry="26" fill="#8B5E3C" transform="rotate(-15 28 38)"/>
        <ellipse cx="72" cy="38" rx="18" ry="26" fill="#8B5E3C" transform="rotate(15 72 38)"/>
        <circle cx="50" cy="54" r="34" fill="#f5f5f0"/>
        <circle cx="40" cy="48" r="4" fill="#222"/>
        <circle cx="60" cy="48" r="4" fill="#222"/>
        <ellipse cx="50" cy="63" rx="7" ry="5" fill="#222"/>
      </svg>`;
    }
    const initials = user.name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
    return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="50" fill="#2a1a08"/>
      <text x="50" y="58" text-anchor="middle" font-size="34" font-family="sans-serif" fill="#b07040">${initials}</text>
    </svg>`;
  }

  function buildCompass() {
    const user     = compassUser || USERS[0];
    const vmin     = Math.min(innerWidth, innerHeight);
    const ringD    = vmin * 0.72;
    const ringR    = ringD / 2;
    const ptSize   = vmin * 0.14;
    const ctrSize  = vmin * 0.20;
    const lblSize  = Math.max(9, vmin * 0.024);
    const cx       = innerWidth / 2, cy = innerHeight / 2;
    const outerD   = ringD * 1.58;

    // Outer ring
    document.getElementById('compass-outer-ring').style.width =
    document.getElementById('compass-outer-ring').style.height = outerD + 'px';

    // Forest ring — same function as Ohana page
    drawForestOn('compass-forest-canvas', outerD / 2, cx, cy);

    // Outer tap → back to Ohana
    const outerTap = document.getElementById('compass-outer-tap');
    const outerR   = outerD / 2;
    outerTap.onmousemove = e => {
      const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
      outerTap.classList.toggle('forest-hover', dist > outerR);
    };
    outerTap.onmouseleave = () => outerTap.classList.remove('forest-hover');
    outerTap.onclick = e => {
      const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
      if (dist > outerR) { closeCompass(); transitionToDiscovery(); }
    };

    const ring = document.getElementById('compass-ring');
    ring.style.width = ring.style.height = ringD + 'px';

    const orbit = document.getElementById('compass-orbit');
    orbit.style.width = orbit.style.height = ringD * 0.86 + 'px';

    // Center — heart for self, avatar for others
    const ctr = document.getElementById('compass-center-circle');
    ctr.style.width = ctr.style.height = ctrSize + 'px';
    ctr.style.overflow = 'hidden';
    if (user.isMe) {
      ctr.innerHTML = `<span style="font-size:${ctrSize * 0.45}px;color:#e05555;display:inline-block;animation:heartbeat 2.2s ease-in-out infinite;">♥</span>`;
    } else {
      ctr.innerHTML = makeAvatarSvg(user, ctrSize);
    }

    // Name below center
    let nameEl = document.getElementById('compass-user-name');
    if (!nameEl) {
      nameEl = document.createElement('div');
      nameEl.id = 'compass-user-name';
      nameEl.style.cssText = 'color:#d8a060;font-size:13px;letter-spacing:.08em;margin-top:8px;text-align:center;pointer-events:none;';
      document.getElementById('compass-center').appendChild(nameEl);
    }
    nameEl.textContent = user.name;

    // Center tap: self → Aloha/Innerwork, others → profile sheet
    ctr.style.cursor = 'pointer';
    ctr.onclick = e => {
      e.stopPropagation();
      if (user.isMe) {
        closeCompass();
        openPage('innerwork');
      } else {
        showCompassProfile(user);
      }
    };

    // Remove old circle points
    ring.querySelectorAll('.compass-point').forEach(el => el.remove());
    const existing = document.getElementById('compass-profile-sheet');
    if (existing) existing.remove();

    user.circles.forEach((pt, i) => {
      const angle = -Math.PI / 2 + (2 * Math.PI / user.circles.length) * i;
      const px    = ringR + Math.cos(angle) * ringR * 0.86;
      const py    = ringR + Math.sin(angle) * ringR * 0.86;

      const wrap = document.createElement('div');
      wrap.className = 'compass-point';
      wrap.style.left = px + 'px';
      wrap.style.top  = py + 'px';

      const circ = document.createElement('div');
      circ.className = 'compass-point-circle';
      circ.style.width = circ.style.height = ptSize + 'px';

      if (pt.create) {
        circ.style.borderStyle = 'dashed';
        circ.style.borderColor = 'rgba(176,112,64,.5)';
        circ.style.background  = 'rgba(40,18,4,.6)';
      }

      const icon = document.createElement('span');
      icon.className      = 'compass-point-icon';
      icon.style.fontSize = (ptSize * 0.38) + 'px';
      icon.style.color    = pt.create ? 'rgba(200,150,80,.85)' : '';
      icon.textContent    = pt.icon;

      const lbl = document.createElement('div');
      lbl.className      = 'compass-point-label';
      lbl.style.fontSize = lblSize + 'px';
      lbl.style.color    = pt.create ? 'rgba(176,112,64,.65)' : '';
      lbl.textContent    = pt.label;

      circ.appendChild(icon);
      wrap.appendChild(circ);
      wrap.appendChild(lbl);

      if (!pt.create) {
        wrap.onclick = e => {
          e.stopPropagation();
          closeCompass();
          // Each community leads to its own Ohana page (home for now)
        };
      }

      ring.appendChild(wrap);
    });
  }

  function showCompassProfile(user) {
    let sheet = document.getElementById('compass-profile-sheet');
    if (!sheet) {
      sheet = document.createElement('div');
      sheet.id = 'compass-profile-sheet';
      sheet.style.cssText = `
        position:absolute;bottom:0;left:0;right:0;
        background:linear-gradient(180deg,rgba(16,5,2,.98),rgba(8,2,1,1));
        border-top:1px solid rgba(176,112,64,.2);
        border-radius:20px 20px 0 0;
        padding:20px 24px 44px;
        z-index:60;
        transform:translateY(100%);
        transition:transform .35s cubic-bezier(.25,.46,.45,.94);
        display:flex;flex-direction:column;align-items:center;text-align:center;
      `;
      document.getElementById('compass').appendChild(sheet);
    }
    const sz = 56;
    sheet.innerHTML = `
      <div style="width:36px;height:4px;background:rgba(176,112,64,.22);border-radius:2px;margin-bottom:18px;"></div>
      <div style="width:${sz}px;height:${sz}px;border-radius:50%;border:1px solid rgba(176,112,64,.3);overflow:hidden;margin-bottom:12px;">${makeAvatarSvg(user, sz)}</div>
      <div style="color:#d8a060;font-size:18px;letter-spacing:.08em;margin-bottom:4px;">${user.name}</div>
      <div style="color:rgba(176,112,64,.35);font-size:10px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:18px;">${user.role || 'Circle Member'}</div>
      <p style="color:#c8904e;font-size:14px;line-height:1.75;font-weight:300;margin-bottom:24px;max-width:280px;">${user.bio || ''}</p>
      <div style="padding:11px 28px;border:1px solid rgba(176,112,64,.3);border-radius:24px;color:#b07040;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;">Send a Message</div>
    `;
    sheet.getBoundingClientRect();
    sheet.style.transform = 'translateY(0)';
    sheet.onclick = e => e.stopPropagation();
  }

  function openCompass(user) {
    compassUser = user || USERS[0];
    buildCompass();
    document.getElementById('compass').classList.add('open');
  }
  function closeCompass() {
    document.getElementById('compass').classList.remove('open');
    const sheet = document.getElementById('compass-profile-sheet');
    if (sheet) sheet.remove();
  }

  document.getElementById('compass-close').addEventListener('click', closeCompass);
  // Removed: clicking blank space no longer closes the overlay

  // ── DISCOVERY ─────────────────────────────────────────────────────────
  let discFilter = 'all';

  function buildDiscovery() {
    const canvas  = document.getElementById('disc-canvas');
    const content = document.getElementById('disc-content');
    canvas.width = innerWidth; canvas.height = innerHeight;
    content.innerHTML = '';

    const ctx  = canvas.getContext('2d');
    ctx.clearRect(0, 0, innerWidth, innerHeight);

    const vmin  = Math.min(innerWidth, innerHeight);
    const cx    = innerWidth / 2;
    const cy    = innerHeight / 2;
    const maxR  = vmin * 0.38;
    const outerD = vmin * 0.72 * 1.58;

    // Forest outer ring — same template
    document.getElementById('disc-outer-ring').style.width =
    document.getElementById('disc-outer-ring').style.height = outerD + 'px';
    drawForestOn('disc-forest-canvas', outerD / 2, cx, cy);

    // Forest tap → back to Cosmic (via disc-content, which sits above outer-tap)
    const outerR = outerD / 2;
    content.onmousemove = e => {
      const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
      content.style.cursor = dist > outerR ? 'pointer' : 'default';
    };
    content.onmouseleave = () => { content.style.cursor = 'default'; };
    content.onclick = e => {
      const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
      if (dist > outerR) transitionFromDiscovery();
    };

    // Proximity rings
    [0.34, 0.67, 1.0].forEach((scale, i) => {
      ctx.beginPath();
      ctx.arc(cx, cy, maxR * scale, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(176,112,64,${0.07 - i * 0.015})`;
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 9]);
      ctx.stroke();
      ctx.setLineDash([]);
    });

    // Connection lines
    const toXY = c => c.isMe
      ? [cx, cy]
      : [cx + Math.cos((c.angle - 90) * Math.PI / 180) * c.dist * maxR,
         cy + Math.sin((c.angle - 90) * Math.PI / 180) * c.dist * maxR];

    CONNECTIONS.forEach(([a, b]) => {
      const ca = COMMUNITIES.find(c => c.id === a);
      const cb = COMMUNITIES.find(c => c.id === b);
      if (!ca || !cb) return;
      const [ax, ay] = toXY(ca), [bx, by] = toXY(cb);
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
      ctx.strokeStyle = 'rgba(176,112,64,.06)';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    });

    // Filter bar
    const filterBar = document.getElementById('disc-filter');
    filterBar.innerHTML = '';
    [['all','All'],['land','Land'],['healing','Healing'],['arts','Arts'],['story','Story']].forEach(([val, label]) => {
      const pill = document.createElement('div');
      pill.className = 'disc-pill' + (discFilter === val ? ' active' : '');
      pill.textContent = label;
      pill.onclick = e => { e.stopPropagation(); discFilter = val; buildDiscovery(); };
      filterBar.appendChild(pill);
    });

    // Community fires
    COMMUNITIES.forEach(comm => {
      const [x, y] = toXY(comm);
      const size   = comm.isMe ? 30 : Math.max(10, 7 + comm.members * 0.38);
      const active = discFilter === 'all' || comm.isMe || comm.type === discFilter;

      const fire = document.createElement('div');
      fire.className = 'comm-fire' + (active ? '' : ' dimmed');
      const gs = (size * 0.5).toFixed(1), gl = (size * 1.2).toFixed(1);
      fire.style.cssText = [
        `left:${x}px`, `top:${y}px`,
        `width:${size}px`, `height:${size}px`,
        `background:radial-gradient(circle,rgba(255,220,100,.95) 8%,rgba(255,120,20,.8) 50%,rgba(255,60,0,0) 100%)`,
        `box-shadow:0 0 ${gs}px ${(size*.2).toFixed(1)}px rgba(255,120,30,.6),0 0 ${gl}px ${(size*.4).toFixed(1)}px rgba(255,80,10,.25)`,
        `animation:hpulse ${(2.2 + Math.random() * 1.8).toFixed(2)}s ease-in-out infinite`,
        `animation-delay:-${(Math.random() * 3).toFixed(2)}s`,
      ].join(';');
      if (active) fire.onclick = e => { e.stopPropagation(); enterCommunityOhana(comm); };
      content.appendChild(fire);

      const lbl = document.createElement('div');
      lbl.className = 'comm-label' + (comm.isMe ? ' mine' : '') + (active ? '' : ' dimmed');
      lbl.style.left = x + 'px';
      lbl.style.top  = (y + size / 2 + 6) + 'px';
      lbl.textContent = comm.name;
      content.appendChild(lbl);
    });
  }

  function showDiscPanel(comm) {
    const panel = document.getElementById('disc-panel');
    const typeLabel = { land:'Land & Stewardship', healing:'Healing Arts', arts:'Creative Arts', story:'Story & Memory' }[comm.type] || comm.type;
    panel.innerHTML = `
      <div style="width:36px;height:4px;background:rgba(176,112,64,.22);border-radius:2px;margin:0 auto 18px;"></div>
      <div style="color:#b07040;font-size:12px;letter-spacing:.18em;text-transform:uppercase;text-align:center;margin-bottom:4px;">${comm.name}</div>
      <div style="color:rgba(176,112,64,.35);font-size:10px;letter-spacing:.1em;text-transform:uppercase;text-align:center;margin-bottom:18px;">${typeLabel}&nbsp;·&nbsp;${comm.members} members</div>
      <p style="color:#c8904e;font-size:15px;line-height:1.75;text-align:center;font-weight:300;margin-bottom:28px;">${comm.desc}</p>
      ${comm.isMe
        ? `<div style="text-align:center;color:rgba(176,112,64,.4);font-size:11px;letter-spacing:.12em;text-transform:uppercase;">Your Circle</div>`
        : `<div style="text-align:center;"><div id="disc-join-btn" style="display:inline-block;padding:12px 32px;border:1px solid rgba(176,112,64,.35);border-radius:24px;color:#b07040;font-size:12px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;">Request to Join</div></div>`
      }
    `;
    panel.getBoundingClientRect();
    panel.style.transform = 'translateY(0)';
    panel.onclick = e => e.stopPropagation();
    if (!comm.isMe) {
      document.getElementById('disc-join-btn').onclick = function() {
        this.textContent = 'Request Sent ✓';
        this.style.opacity = '.5';
        this.style.pointerEvents = 'none';
      };
    }
  }

  function enterCommunityOhana(comm) {
    document.getElementById('discovery').classList.remove('visible');
    document.getElementById('home').classList.remove('fade-out');
  }

  function transitionToDiscovery() {
    discFilter = 'all';
    buildDiscovery();
    document.getElementById('disc-panel').style.transform = 'translateY(100%)';
    document.getElementById('discovery').classList.add('visible');
    document.getElementById('home').classList.add('fade-out');
  }

  function transitionFromDiscovery() {
    document.getElementById('discovery').classList.remove('visible');
    // Only restore home fade if cosmic isn't the destination
    // (home stays faded while cosmic is open above it)
    openPage('cosmic');
  }

  // ── INNERWORK / ALOHA PAGE ────────────────────────────────────────────
  const IW_ITEMS = [
    { label: 'Journal',      icon: '📖', type: 'journal'     },
    { label: 'Meditation',   icon: '🌙', type: 'meditation'  },
    { label: 'Commitments',  icon: '🌿', type: 'commitments' },
    { label: 'Chat',         icon: '🔥', type: 'chat'        },
  ];

  function buildInnerwork() {
    const vmin    = Math.min(innerWidth, innerHeight);
    const ringD   = vmin * 0.72;
    const ringR   = ringD / 2;
    const ptSize  = vmin * 0.14;
    const ctrSize = vmin * 0.22;
    const lblSize = Math.max(9, vmin * 0.024);
    const cx      = innerWidth / 2, cy = innerHeight / 2;
    const outerD  = ringD * 1.58;

    // Outer ring size
    document.getElementById('iw-outer-ring').style.width =
    document.getElementById('iw-outer-ring').style.height = outerD + 'px';

    // Forest ring
    drawForestOn('iw-forest-canvas', outerD / 2, cx, cy);

    // Outer tap → Cosmic (for now closes back to Community)
    const outerTap = document.getElementById('iw-outer-tap');
    const outerR   = outerD / 2;
    outerTap.onmousemove = e => {
      const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
      outerTap.style.cursor = dist > outerR ? 'pointer' : 'default';
    };
    outerTap.onmouseleave = () => outerTap.style.cursor = 'default';
    outerTap.onclick = e => {
      const panel = document.getElementById('iw-panel');
      const panelOpen = panel.style.transform === 'translateY(0px)' || panel.style.transform === 'translateY(0)';
      const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
      if (panelOpen) {
        panel.style.transform = 'translateY(100%)';
      } else if (dist > outerR) {
        closePage('innerwork');
      }
    };

    const ring = document.getElementById('iw-ring');
    ring.style.width = ring.style.height = ringD + 'px';
    ring.innerHTML = '';

    // Dashed orbit ring
    const orbit = document.createElement('div');
    orbit.style.cssText = `position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      border:1px dashed rgba(176,112,64,.22);border-radius:50%;pointer-events:none;
      width:${ringD * 0.86}px;height:${ringD * 0.86}px;`;
    ring.appendChild(orbit);

    // Heart center → Cosmic
    const ctrWrap = document.createElement('div');
    ctrWrap.style.cssText = `position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      display:flex;flex-direction:column;align-items:center;gap:0;z-index:2;cursor:pointer;`;

    const ctr = document.createElement('div');
    ctr.style.cssText = `width:${ctrSize}px;height:${ctrSize}px;border-radius:50%;
      background:rgba(40,8,8,.95);border:1px solid rgba(220,80,80,.35);
      box-shadow:0 0 20px 6px rgba(200,50,50,.2),0 0 50px 18px rgba(180,30,30,.1);
      display:flex;align-items:center;justify-content:center;
      transition:box-shadow .2s;`;

    const star = document.createElement('span');
    star.style.cssText = `font-size:${ctrSize * 0.42}px;color:#8899ff;display:inline-block;animation:starPulse 2.8s ease-in-out infinite;`;
    star.textContent = '✦';
    ctr.style.background = 'rgba(8,8,40,.95)';
    ctr.style.border = '1px solid rgba(100,120,255,.35)';
    ctr.style.boxShadow = '0 0 20px 6px rgba(80,100,255,.2),0 0 50px 18px rgba(60,80,220,.1)';
    ctr.appendChild(star);

    const ctrLbl = document.createElement('div');
    ctrLbl.style.cssText = `color:rgba(120,140,255,.4);font-size:9px;letter-spacing:.22em;text-transform:uppercase;margin-top:10px;pointer-events:none;`;
    ctrLbl.textContent = 'Cosmic';

    ctrWrap.appendChild(ctr);
    ctrWrap.appendChild(ctrLbl);
    ctrWrap.onclick = e => { e.stopPropagation(); openPage('cosmic'); };
    ring.appendChild(ctrWrap);

    // Practice items around the ring
    IW_ITEMS.forEach((item, i) => {
      const angle = -Math.PI / 2 + (2 * Math.PI / IW_ITEMS.length) * i;
      const px    = ringR + Math.cos(angle) * ringR * 0.86;
      const py    = ringR + Math.sin(angle) * ringR * 0.86;

      const wrap = document.createElement('div');
      wrap.className = 'compass-point';
      wrap.style.left = px + 'px';
      wrap.style.top  = py + 'px';
      wrap.style.cursor = 'pointer';

      const circ = document.createElement('div');
      circ.className = 'compass-point-circle';
      circ.style.width = circ.style.height = ptSize + 'px';

      const icon = document.createElement('span');
      icon.className      = 'compass-point-icon';
      icon.style.fontSize = (ptSize * 0.38) + 'px';
      icon.textContent    = item.icon;

      const lbl = document.createElement('div');
      lbl.className      = 'compass-point-label';
      lbl.style.fontSize = lblSize + 'px';
      lbl.textContent    = item.label;

      circ.appendChild(icon);
      wrap.appendChild(circ);
      wrap.appendChild(lbl);
      wrap.onclick = e => { e.stopPropagation(); openIntentionPanel(item.type); };
      ring.appendChild(wrap);
    });
  }

  // ── INTENTION PANELS ─────────────────────────────────────────────────
  const DAILY_PROMPT = 'What are you bringing to the circle today?';

  const PLEDGES = [
    { text: 'Tend the lower garden', due: 'Tuesday morning' },
    { text: 'Bring flowers to evening circle', due: 'Tonight' },
    { text: 'Check in with Kaimana', due: 'This week' },
  ];

  function openIntentionPanel(type) {
    const panel = document.getElementById('iw-panel');

    if (type === 'journal') {
      panel.innerHTML = `
        <div style="width:36px;height:4px;background:rgba(176,112,64,.22);border-radius:2px;margin:0 auto 18px;"></div>
        <div style="color:rgba(176,112,64,.35);font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-align:center;margin-bottom:12px;">Journal</div>
        <p style="color:#c8904e;font-size:16px;line-height:1.7;text-align:center;font-style:italic;font-weight:300;margin-bottom:20px;">${DAILY_PROMPT}</p>
        <textarea id="iw-journal-text" style="width:100%;min-height:120px;background:rgba(255,255,255,.03);border:1px solid rgba(176,112,64,.15);border-radius:10px;padding:14px;color:#d8a060;font-size:14px;line-height:1.6;resize:none;outline:none;font-family:inherit;" placeholder="Write here…"></textarea>
        <div style="text-align:right;margin-top:12px;">
          <div id="iw-journal-save" style="display:inline-block;padding:9px 22px;border:1px solid rgba(176,112,64,.3);border-radius:20px;color:#b07040;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;">Save</div>
        </div>
      `;
      panel.onclick = e => e.stopPropagation();
      document.getElementById('iw-journal-save').onclick = () => {
        panel.style.transform = 'translateY(100%)';
      };

    } else if (type === 'meditation') {
      let interval = null;
      panel.innerHTML = `
        <div style="width:36px;height:4px;background:rgba(176,112,64,.22);border-radius:2px;margin:0 auto 18px;"></div>
        <div style="color:rgba(176,112,64,.35);font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-align:center;margin-bottom:24px;">Meditation</div>
        <div id="iw-med-timer" style="color:#d8a060;font-size:48px;font-weight:200;text-align:center;letter-spacing:.06em;margin-bottom:8px;">5:00</div>
        <div id="iw-med-cue" style="color:rgba(176,112,64,.35);font-size:13px;text-align:center;letter-spacing:.1em;margin-bottom:28px;">Breathe in… hold… breathe out</div>
        <div style="display:flex;justify-content:center;gap:12px;margin-bottom:20px;">
          ${[5,10,20].map(m => `<div class="iw-med-dur" data-min="${m}" style="padding:7px 16px;border:1px solid rgba(176,112,64,.2);border-radius:16px;color:rgba(176,112,64,.5);font-size:11px;letter-spacing:.1em;cursor:pointer;">${m} min</div>`).join('')}
        </div>
        <div style="text-align:center;">
          <div id="iw-med-btn" style="display:inline-block;padding:11px 32px;border:1px solid rgba(176,112,64,.35);border-radius:24px;color:#b07040;font-size:12px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;">Begin</div>
        </div>
      `;
      panel.onclick = e => e.stopPropagation();

      let totalSecs = 5 * 60, remaining = totalSecs, running = false;
      const cues = ['Breathe in… hold… breathe out', 'Let the mind settle', 'Feel where you are', 'Release what you carry', 'You are here'];
      let cueIdx = 0;

      panel.querySelectorAll('.iw-med-dur').forEach(btn => {
        btn.onclick = () => {
          totalSecs = remaining = parseInt(btn.dataset.min) * 60;
          const m = Math.floor(remaining/60), s = remaining % 60;
          document.getElementById('iw-med-timer').textContent = `${m}:${s.toString().padStart(2,'0')}`;
        };
      });

      document.getElementById('iw-med-btn').onclick = () => {
        if (running) {
          clearInterval(interval); running = false;
          document.getElementById('iw-med-btn').textContent = 'Resume';
        } else {
          running = true;
          document.getElementById('iw-med-btn').textContent = 'Pause';
          interval = setInterval(() => {
            remaining--;
            const m = Math.floor(remaining/60), s = remaining % 60;
            document.getElementById('iw-med-timer').textContent = `${m}:${s.toString().padStart(2,'0')}`;
            if (remaining % 30 === 0) {
              cueIdx = (cueIdx + 1) % cues.length;
              document.getElementById('iw-med-cue').textContent = cues[cueIdx];
            }
            if (remaining <= 0) { clearInterval(interval); running = false; document.getElementById('iw-med-btn').textContent = 'Done'; }
          }, 1000);
        }
      };

    } else if (type === 'commitments') {
      panel.innerHTML = `
        <div style="width:36px;height:4px;background:rgba(176,112,64,.22);border-radius:2px;margin:0 auto 18px;"></div>
        <div style="color:rgba(176,112,64,.35);font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-align:center;margin-bottom:20px;">Commitments</div>
        <div style="color:#b07040;font-size:10px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:10px;">Gatherings</div>
        ${EVENTS.map(ev => `
          <div style="display:flex;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid rgba(176,112,64,.08);">
            <div style="text-align:center;min-width:28px;">
              <div style="color:#b07040;font-size:18px;font-weight:300;line-height:1;">${ev.day}</div>
              <div style="color:#4a2808;font-size:9px;text-transform:uppercase;letter-spacing:.06em;">${ev.month}</div>
            </div>
            <div style="flex:1;">
              <div style="color:#d8a060;font-size:14px;">${ev.name}</div>
              <div style="color:#5a3018;font-size:11px;">${ev.detail}</div>
            </div>
            <div style="width:8px;height:8px;border-radius:50%;background:rgba(100,200,100,.6);flex-shrink:0;"></div>
          </div>`).join('')}
        <div style="color:#b07040;font-size:10px;letter-spacing:.18em;text-transform:uppercase;margin-top:20px;margin-bottom:10px;">Pledges</div>
        ${PLEDGES.map(p => `
          <div style="display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid rgba(176,112,64,.08);">
            <div style="width:16px;height:16px;border-radius:50%;border:1px solid rgba(176,112,64,.3);flex-shrink:0;margin-top:2px;cursor:pointer;"></div>
            <div>
              <div style="color:#d8a060;font-size:14px;margin-bottom:2px;">${p.text}</div>
              <div style="color:#5a3018;font-size:11px;">${p.due}</div>
            </div>
          </div>`).join('')}
        <div style="display:flex;gap:12px;align-items:center;padding:14px 0;cursor:pointer;">
          <div style="width:16px;height:16px;border-radius:50%;border:1px dashed rgba(176,112,64,.3);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:rgba(176,112,64,.4);font-size:12px;">+</div>
          <div style="color:rgba(176,112,64,.4);font-size:13px;letter-spacing:.06em;">Add a pledge</div>
        </div>
      `;
      panel.onclick = e => e.stopPropagation();

    } else if (type === 'chat') {
      panel.innerHTML = `
        <div style="width:36px;height:4px;background:rgba(176,112,64,.22);border-radius:2px;margin:0 auto 18px;"></div>
        <div style="color:rgba(176,112,64,.35);font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-align:center;margin-bottom:14px;">Circle Chat</div>
        <div id="iw-chat-msgs" style="max-height:38vh;overflow-y:auto;margin-bottom:12px;">
          ${SEED_CHAT.map(m => `
            <div style="margin-bottom:10px;${m.sent ? 'text-align:right;' : ''}">
              ${!m.sent ? `<div style="color:#5a3018;font-size:11px;margin-bottom:3px;padding:0 4px;">${m.name}</div>` : ''}
              <div style="display:inline-block;padding:9px 13px;font-size:14px;max-width:78%;line-height:1.4;color:#d8a060;background:rgba(176,112,64,${m.sent ? '.2' : '.1'});border-radius:${m.sent ? '16px 4px 16px 16px' : '4px 16px 16px 16px'};">${m.text}</div>
            </div>`).join('')}
        </div>
        <div style="display:flex;gap:10px;border-top:1px solid rgba(176,112,64,.1);padding-top:10px;">
          <input id="iw-chat-input" type="text" placeholder="Share with the circle…" style="flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(176,112,64,.18);border-radius:20px;padding:10px 14px;color:#d8a060;font-size:14px;outline:none;">
          <button id="iw-chat-send" style="width:40px;height:40px;flex-shrink:0;border-radius:50%;background:rgba(176,112,64,.18);border:1px solid rgba(176,112,64,.32);color:#b07040;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;">→</button>
        </div>
      `;
      panel.onclick = e => e.stopPropagation();
      const send = () => {
        const input = document.getElementById('iw-chat-input');
        const text = input.value.trim(); if (!text) return;
        const msgs = document.getElementById('iw-chat-msgs');
        msgs.innerHTML += `<div style="margin-bottom:10px;text-align:right;"><div style="display:inline-block;padding:9px 13px;font-size:14px;max-width:78%;line-height:1.4;color:#d8a060;background:rgba(176,112,64,.2);border-radius:16px 4px 16px 16px;">${text.replace(/</g,'&lt;')}</div></div>`;
        input.value = ''; msgs.scrollTop = msgs.scrollHeight;
      };
      document.getElementById('iw-chat-send').onclick = send;
      document.getElementById('iw-chat-input').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
    }

    panel.getBoundingClientRect();
    panel.style.transform = 'translateY(0)';
  }

  // ── COSMIC PAGE ───────────────────────────────────────────────────────
  const COSMIC_ITEMS = [
    { label: 'Events',    icon: '🌟', type: 'events'   },
    { label: 'Meet Up',   icon: '🤝', type: 'meetup'   },
    { label: 'Gathering', icon: '🔥', type: 'gathering' },
    { label: 'New Ohana', icon: '🌺', type: 'ohana'    },
  ];

  function buildCosmic() {
    const vmin   = Math.min(innerWidth, innerHeight);
    const ringD  = vmin * 0.72;
    const ringR  = ringD / 2;
    const ptSize = vmin * 0.14;
    const ctrSize= vmin * 0.22;
    const lblSize= Math.max(9, vmin * 0.024);
    const cx     = innerWidth / 2, cy = innerHeight / 2;
    const outerD = ringD * 1.58;

    document.getElementById('cosmic-outer-ring').style.width =
    document.getElementById('cosmic-outer-ring').style.height = outerD + 'px';

    drawForestOn('cosmic-forest-canvas', outerD / 2, cx, cy);

    // Outer tap — cursor + forest/panel logic set below after ring is built
    const outerTap = document.getElementById('cosmic-outer-tap');
    const outerR   = outerD / 2;
    outerTap.onmousemove = e => {
      const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
      outerTap.style.cursor = dist > outerR ? 'pointer' : 'default';
    };
    outerTap.onmouseleave = () => outerTap.style.cursor = 'default';

    const ring = document.getElementById('cosmic-ring');
    ring.style.width = ring.style.height = ringD + 'px';
    ring.innerHTML = '';

    // Dashed orbit ring
    const orbit = document.createElement('div');
    orbit.style.cssText = `position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      border:1px dashed rgba(100,120,255,.18);border-radius:50%;pointer-events:none;
      width:${ringD * 0.86}px;height:${ringD * 0.86}px;`;
    ring.appendChild(orbit);

    // Globe center → Global
    const ctrWrap = document.createElement('div');
    ctrWrap.style.cssText = `position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      display:flex;flex-direction:column;align-items:center;gap:0;z-index:2;cursor:pointer;`;

    const ctr = document.createElement('div');
    ctr.style.cssText = `width:${ctrSize}px;height:${ctrSize}px;border-radius:50%;
      background:rgba(4,8,28,.95);border:1px solid rgba(60,120,200,.35);
      box-shadow:0 0 20px 6px rgba(40,80,200,.2),0 0 50px 18px rgba(20,60,180,.1);
      display:flex;align-items:center;justify-content:center;transition:box-shadow .2s;`;

    const globe = document.createElement('div');
    globe.style.cssText = `width:${ctrSize*.62}px;height:${ctrSize*.62}px;display:inline-block;animation:starPulse 3.5s ease-in-out infinite;`;
    globe.innerHTML = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
      <circle cx="50" cy="50" r="46" fill="rgba(10,30,80,.9)" stroke="rgba(60,120,220,.5)" stroke-width="2"/>
      <ellipse cx="50" cy="50" rx="20" ry="46" fill="none" stroke="rgba(60,160,220,.3)" stroke-width="1.2"/>
      <ellipse cx="50" cy="50" rx="46" ry="16" fill="none" stroke="rgba(60,160,220,.3)" stroke-width="1.2"/>
      <ellipse cx="50" cy="50" rx="46" ry="30" fill="none" stroke="rgba(60,160,220,.2)" stroke-width="1"/>
      <path d="M18 35 Q30 28 38 38 Q44 30 55 32 Q60 22 72 26 Q80 34 76 44 Q68 40 60 48 Q52 42 44 50 Q34 46 28 54 Q20 46 18 35Z" fill="rgba(30,160,80,.55)"/>
      <path d="M24 62 Q32 56 42 60 Q48 68 40 72 Q30 70 24 62Z" fill="rgba(30,160,80,.45)"/>
      <path d="M60 55 Q70 50 78 58 Q74 66 64 64 Q58 60 60 55Z" fill="rgba(30,160,80,.45)"/>
    </svg>`;
    ctr.appendChild(globe);

    const ctrLbl = document.createElement('div');
    ctrLbl.style.cssText = `color:rgba(60,120,220,.4);font-size:9px;letter-spacing:.22em;text-transform:uppercase;margin-top:10px;pointer-events:none;`;
    ctrLbl.textContent = 'Global';

    ctrWrap.appendChild(ctr);
    ctrWrap.appendChild(ctrLbl);
    ctrWrap.onclick = e => { e.stopPropagation(); closePage('cosmic'); transitionToDiscovery(); };
    ring.appendChild(ctrWrap);

    // Cosmic practice items
    COSMIC_ITEMS.forEach((item, i) => {
      const angle = -Math.PI / 2 + (2 * Math.PI / COSMIC_ITEMS.length) * i;
      const px    = ringR + Math.cos(angle) * ringR * 0.86;
      const py    = ringR + Math.sin(angle) * ringR * 0.86;

      const wrap = document.createElement('div');
      wrap.className = 'compass-point';
      wrap.style.left = px + 'px';
      wrap.style.top  = py + 'px';
      wrap.style.cursor = 'pointer';

      const circ = document.createElement('div');
      circ.className = 'compass-point-circle';
      circ.style.width = circ.style.height = ptSize + 'px';
      circ.style.borderColor = 'rgba(80,100,255,.3)';

      const icon = document.createElement('span');
      icon.className      = 'compass-point-icon';
      icon.style.fontSize = (ptSize * 0.38) + 'px';
      icon.textContent    = item.icon;

      const lbl = document.createElement('div');
      lbl.className      = 'compass-point-label';
      lbl.style.fontSize = lblSize + 'px';
      lbl.style.color    = 'rgba(120,140,255,.6)';
      lbl.textContent    = item.label;

      circ.appendChild(icon);
      wrap.appendChild(circ);
      wrap.appendChild(lbl);
      wrap.onclick = e => { e.stopPropagation(); openCosmicPanel(item.type); };
      ring.appendChild(wrap);
    });

    // Tapping cosmic background collapses open panel
    document.getElementById('cosmic-outer-tap').onclick = e => {
      const panel = document.getElementById('cosmic-panel');
      if (panel.style.transform === 'translateY(0px)' || panel.style.transform === 'translateY(0)') {
        panel.style.transform = 'translateY(100%)';
      } else {
        const dist = Math.hypot(e.clientX - innerWidth/2, e.clientY - innerHeight/2);
        const outerR = parseFloat(document.getElementById('cosmic-outer-ring').style.width) / 2;
        if (dist > outerR) { closePage('cosmic'); openPage('innerwork'); }
      }
    };
  }

  function openCosmicPanel(type) {
    const panel = document.getElementById('cosmic-panel');
    const me = USERS.find(u => u.isMe);

    if (type === 'events') {
      panel.innerHTML = `
        <div style="width:36px;height:4px;background:rgba(176,112,64,.22);border-radius:2px;margin:0 auto 18px;"></div>
        <div style="color:#b07040;font-size:12px;letter-spacing:.18em;text-transform:uppercase;text-align:center;margin-bottom:18px;">Nearby Events</div>
        ${EVENTS.map(ev => `
          <div style="display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-bottom:1px solid rgba(176,112,64,.1);">
            <div>
              <div style="color:#b07040;font-size:22px;font-weight:300;line-height:1;">${ev.day}</div>
              <div style="color:#4a2808;font-size:10px;text-transform:uppercase;letter-spacing:.08em;">${ev.month}</div>
            </div>
            <div>
              <div style="color:#d8a060;font-size:15px;margin-bottom:3px;">${ev.name}</div>
              <div style="color:#5a3018;font-size:12px;">${ev.detail}</div>
            </div>
          </div>`).join('')}
      `;
    } else if (type === 'meetup') {
      const others = USERS.filter(u => !u.isMe);
      const suggestion = others[Math.floor(Math.random() * others.length)];
      const sz = 52;
      panel.innerHTML = `
        <div style="width:36px;height:4px;background:rgba(176,112,64,.22);border-radius:2px;margin:0 auto 18px;"></div>
        <div style="color:#b07040;font-size:12px;letter-spacing:.18em;text-transform:uppercase;text-align:center;margin-bottom:6px;">Someone to Meet</div>
        <p style="color:rgba(176,112,64,.35);font-size:11px;text-align:center;margin-bottom:20px;letter-spacing:.06em;">You haven't connected with this person in a while</p>
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:24px;">
          <div style="width:${sz}px;height:${sz}px;border-radius:50%;border:1px solid rgba(176,112,64,.3);overflow:hidden;flex-shrink:0;">${makeAvatarSvg(suggestion, sz)}</div>
          <div>
            <div style="color:#d8a060;font-size:17px;margin-bottom:3px;">${suggestion.name}</div>
            <div style="color:rgba(176,112,64,.4);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;">${suggestion.role}</div>
            <div style="color:#c8904e;font-size:13px;line-height:1.6;">${suggestion.bio}</div>
          </div>
        </div>
        <div style="text-align:center;">
          <div style="display:inline-block;padding:11px 28px;border:1px solid rgba(176,112,64,.3);border-radius:24px;color:#b07040;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;">Send a Message</div>
        </div>
      `;
    } else if (type === 'gathering') {
      panel.innerHTML = `
        <div style="width:36px;height:4px;background:rgba(176,112,64,.22);border-radius:2px;margin:0 auto 18px;"></div>
        <div style="color:#b07040;font-size:12px;letter-spacing:.18em;text-transform:uppercase;text-align:center;margin-bottom:18px;">Open Gatherings</div>
        ${[
          { name: 'Morning Circle',      detail: 'Daily · Sunrise · Fire Pit',        open: true  },
          { name: 'Communal Dinner',     detail: 'Tonight · 6pm · Main Hall',          open: true  },
          { name: 'Work Party — Garden', detail: 'Saturday · 8am · Lower Field',       open: true  },
          { name: 'Story Night',         detail: 'Friday · 7pm · 4 spots remaining',   open: false },
        ].map(g => `
          <div style="display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid rgba(176,112,64,.1);">
            <div style="width:8px;height:8px;border-radius:50%;background:${g.open ? 'rgba(100,200,100,.7)' : 'rgba(200,150,60,.5)'};flex-shrink:0;margin-top:2px;"></div>
            <div style="flex:1;">
              <div style="color:#d8a060;font-size:15px;margin-bottom:3px;">${g.name}</div>
              <div style="color:#5a3018;font-size:12px;">${g.detail}</div>
            </div>
            <div style="color:rgba(176,112,64,.35);font-size:18px;">›</div>
          </div>`).join('')}
      `;
    } else if (type === 'ohana') {
      const suggestions = COMMUNITIES.filter(c => !c.isMe).slice(0, 3);
      panel.innerHTML = `
        <div style="width:36px;height:4px;background:rgba(176,112,64,.22);border-radius:2px;margin:0 auto 18px;"></div>
        <div style="color:#b07040;font-size:12px;letter-spacing:.18em;text-transform:uppercase;text-align:center;margin-bottom:6px;">Explore a New Ohana</div>
        <p style="color:rgba(176,112,64,.35);font-size:11px;text-align:center;margin-bottom:20px;letter-spacing:.06em;">Communities that share your values</p>
        ${suggestions.map(c => `
          <div style="padding:14px 0;border-bottom:1px solid rgba(176,112,64,.1);">
            <div style="color:#d8a060;font-size:15px;margin-bottom:4px;">${c.name}</div>
            <div style="color:#5a3018;font-size:12px;line-height:1.55;margin-bottom:10px;">${c.desc}</div>
            <div style="color:rgba(176,112,64,.4);font-size:10px;letter-spacing:.1em;text-transform:uppercase;">${c.members} members</div>
          </div>`).join('')}
      `;
    }

    panel.onclick = e => e.stopPropagation();
    panel.getBoundingClientRect();
    panel.style.transform = 'translateY(0)';
  }

  function openPage(id) {
    if (id === 'innerwork') buildInnerwork();
    if (id === 'cosmic')    buildCosmic();
    const el = document.getElementById(id);
    el.style.opacity = '1';
    el.style.pointerEvents = 'all';
  }

  function closePage(id) {
    const el = document.getElementById(id);
    el.style.opacity = '0';
    el.style.pointerEvents = 'none';
  }

  document.getElementById('iw-close').addEventListener('click', () => { closePage('innerwork'); });
  document.getElementById('cosmic-close').addEventListener('click', () => { closePage('cosmic'); openPage('innerwork'); });

  // ── INIT ──────────────────────────────────────────────────────────────
  layout();
  // Discovery navigation is handled by #outer-tap click in layout()

  document.getElementById('disc-close').onclick = transitionFromDiscovery;

  // Tapping discovery background collapses open panel
  document.getElementById('discovery').addEventListener('click', () => {
    const p = document.getElementById('disc-panel');
    if (p.style.transform !== 'translateY(100%)') p.style.transform = 'translateY(100%)';
  });

  window.addEventListener('resize', () => {
    layout();
    if (document.getElementById('discovery').classList.contains('visible')) buildDiscovery();
  });
</script>
</body>
</html>
