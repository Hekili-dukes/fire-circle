<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fire Circle</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .screen { position: absolute; inset: 0; }

    /* ── HOME ────────────────────────────────────────────────────────── */
    #home { background: #111; transition: opacity 0.8s ease; }
    #home.fade-out { opacity: 0; pointer-events: none; }

    #orbit-ring {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      border: 2px dashed #666;
      border-radius: 50%;
    }

    #center {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: transparent;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      z-index: 4;
    }
    #fire-canvas {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
    }

    #avatars {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }
    .avatar {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translate(-50%, -50%);
      pointer-events: all;
    }
    .avatar-circle { background: #2a2a2a; border-radius: 50%; border: 2px solid #666; }
    .avatar-label  { margin-top: 6px; color: #888; font-family: sans-serif; white-space: nowrap; }

    .avatar-circle.me {
      border: 2px solid rgba(255,200,80,.7);
      box-shadow: 0 0 10px 4px rgba(255,160,40,.45), 0 0 22px 8px rgba(255,100,20,.2);
      cursor: pointer;
      animation: me-pulse 3s ease-in-out infinite;
    }
    @keyframes me-pulse {
      0%, 100% { box-shadow: 0 0 10px 4px rgba(255,160,40,.45), 0 0 22px 8px rgba(255,100,20,.2); }
      50%       { box-shadow: 0 0 16px 7px rgba(255,180,60,.65), 0 0 34px 14px rgba(255,120,30,.3); }
    }

    /* ── COMMUNITY PAGE ──────────────────────────────────────────────── */
    @keyframes starPulse {
      0%, 100% { transform: scale(1) rotate(0deg);   opacity: .85; }
      50%       { transform: scale(1.18) rotate(15deg); opacity: 1;   }
    }

    /* Beating heart */
    @keyframes heartbeat {
      0%   { transform: scale(1);    }
      14%  { transform: scale(1.18); }
      28%  { transform: scale(1);    }
      42%  { transform: scale(1.12); }
      56%  { transform: scale(1);    }
      100% { transform: scale(1);    }
    }

    /* ── FIRE LOGS (home screen) ────────────────────────────────────── */
    #fire-logs {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 6;
      opacity: 0;
      transition: opacity .45s ease;
    }
    #fire-logs.logs-visible {
      opacity: 1;
      pointer-events: all;
    }
    .fire-log {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      transform: translate(-50%, -50%);
      cursor: pointer;
      pointer-events: all;
    }
    .fire-log-dot {
      border-radius: 50%;
      background: rgba(60,25,5,.9);
      border: 1px solid rgba(176,112,64,.25);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .fire-log:hover .fire-log-dot {
      border-color: rgba(255,160,50,.5);
      box-shadow: 0 0 10px 3px rgba(255,100,20,.2);
    }
    .fire-log-label {
      color: rgba(176,112,64,.45);
      font-size: 9px;
      letter-spacing: .16em;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      transition: color 0.2s;
    }
    .fire-log:hover .fire-log-label { color: rgba(200,130,60,.75); }

    /* ── HOME PANEL (fire logs) ──────────────────────────────────────── */
    #home-panel {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(180deg, rgba(16,5,2,.97) 0%, rgba(8,2,1,.99) 100%);
      border-top: 1px solid rgba(176,112,64,.2);
      border-radius: 20px 20px 0 0;
      padding: 20px 24px 44px;
      z-index: 10;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
      max-height: 72vh;
      overflow-y: auto;
    }
    /* ── OUTER RING (home screen) ────────────────────────────────────── */
    #outer-ring {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px solid rgba(80,140,60,.28);
      box-shadow: 0 0 0 1px rgba(80,140,60,.08), inset 0 0 0 1px rgba(80,140,60,.08);
      pointer-events: none;
      z-index: 1;
    }
    #forest-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
    #outer-tap {
      position: absolute;
      inset: 0;
      cursor: default;
      z-index: 1;
    }
    #outer-tap.forest-hover { cursor: pointer; }

    /* ── DISCOVERY / GLOBAL ─────────────────────────────────────────── */
    #discovery {
      background: #070715;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
      z-index: 60;
    }
    #discovery.visible { opacity: 1; pointer-events: all; }

    #disc-canvas { position: absolute; inset: 0; pointer-events: none; }
    #disc-content { position: absolute; inset: 0; }

    .comm-fire {
      position: absolute;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      transition: transform 0.2s, opacity 0.3s;
    }
    .comm-fire:hover { transform: translate(-50%, -50%) scale(1.3); }
    .comm-fire.dimmed { opacity: 0.12; pointer-events: none; }

    .comm-label {
      position: absolute;
      text-align: center;
      pointer-events: none;
      color: rgba(176,112,64,.5);
      font-size: 10px;
      letter-spacing: 0.08em;
      transform: translateX(-50%);
      white-space: nowrap;
      transition: opacity 0.3s;
    }
    .comm-label.mine { color: rgba(255,180,80,.8); font-size: 11px; }
    .comm-label.dimmed { opacity: 0.1; }

    #disc-filter {
      position: absolute;
      bottom: 32px; left: 0; right: 0;
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 0 12px;
      flex-wrap: wrap;
    }
    .disc-pill {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(176,112,64,.2);
      color: rgba(176,112,64,.4);
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      cursor: pointer;
      background: transparent;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .disc-pill.active {
      border-color: rgba(176,112,64,.55);
      color: #b07040;
      background: rgba(176,112,64,.08);
    }
    #disc-close { display: none; }
    #disc-level {
      position: absolute;
      top: 18px; left: 50%; transform: translateX(-50%);
      color: rgba(176,112,64,.22);
      font-size: 9px;
      letter-spacing: .22em;
      text-transform: uppercase;
      pointer-events: none;
      white-space: nowrap;
    }
    #disc-panel {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(180deg, rgba(16,5,2,.97), rgba(8,2,1,.99));
      border-top: 1px solid rgba(176,112,64,.2);
      border-radius: 20px 20px 0 0;
      padding: 20px 24px 40px;
      z-index: 20;
      transform: translateY(100%);
      transition: transform .35s cubic-bezier(.25,.46,.45,.94);
    }
  </style>
</head>
<body>

<!-- HOME SCREEN -->
<div id="home" class="screen">
  <canvas id="forest-canvas"></canvas>
  <div id="outer-tap"></div>
  <div id="outer-ring"></div>
  <div id="orbit-ring"></div>
  <div id="center"></div>
  <div id="fire-logs"></div>
  <div id="avatars"></div>
  <div id="home-mission" style="position:absolute;bottom:32px;left:50%;transform:translateX(-50%);color:rgba(176,112,64,.18);font-size:11px;font-style:italic;font-weight:300;letter-spacing:.06em;white-space:nowrap;pointer-events:none;z-index:2;">Healing the world by building community</div>
  <div id="home-panel"></div>
</div>


<!-- DISCOVERY SCREEN -->
<div id="discovery" class="screen">
  <canvas id="disc-forest-canvas" style="position:absolute;inset:0;pointer-events:none;z-index:1;"></canvas>
  <div id="disc-outer-tap" style="position:absolute;inset:0;cursor:default;z-index:2;"></div>
  <div id="disc-outer-ring" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;border:2px solid rgba(80,140,60,.28);box-shadow:0 0 0 1px rgba(80,140,60,.08),inset 0 0 0 1px rgba(80,140,60,.08);pointer-events:none;z-index:2;"></div>
  <div id="disc-level" style="position:absolute;top:18px;left:50%;transform:translateX(-50%);color:rgba(60,120,220,.22);font-size:9px;letter-spacing:.22em;text-transform:uppercase;pointer-events:none;white-space:nowrap;z-index:10;">Global</div>
  <div id="disc-close" style="position:absolute;top:24px;right:28px;color:rgba(176,112,64,.35);font-size:11px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;z-index:10;transition:color .2s;">← Aloha</div>
  <canvas id="disc-canvas" style="position:absolute;inset:0;pointer-events:none;z-index:3;"></canvas>
  <div id="disc-content" style="position:absolute;inset:0;z-index:4;"></div>
  <div id="disc-filter" style="z-index:10;"></div>
  <div id="disc-my-circles-btn" style="position:absolute;bottom:28px;left:50%;transform:translateX(-50%);
    padding:10px 28px;border:1px solid rgba(176,112,64,.28);border-radius:24px;
    color:rgba(176,112,64,.55);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    cursor:pointer;z-index:10;white-space:nowrap;background:rgba(8,2,1,.7);
    transition:color .2s,border-color .2s;">My Circles</div>
  <div id="disc-panel" style="z-index:20;"></div>
</div>

<!-- INTENTION PAGE -->
<div id="innerwork" class="screen" style="background:#020803;opacity:0;pointer-events:none;transition:opacity .6s ease;display:flex;align-items:center;justify-content:center;z-index:50;">
  <canvas id="iw-forest-canvas" style="position:absolute;inset:0;pointer-events:none;z-index:1;"></canvas>
  <div id="iw-outer-tap" style="position:absolute;inset:0;cursor:default;z-index:2;"></div>
  <div id="iw-outer-ring" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;border:2px solid rgba(80,140,60,.28);box-shadow:0 0 0 1px rgba(80,140,60,.08),inset 0 0 0 1px rgba(80,140,60,.08);pointer-events:none;z-index:2;"></div>
  <div style="position:absolute;top:18px;left:50%;transform:translateX(-50%);color:rgba(176,112,64,.22);font-size:9px;letter-spacing:.22em;text-transform:uppercase;pointer-events:none;white-space:nowrap;z-index:10;">Intention</div>
  <div id="iw-ring" style="position:relative;border-radius:50%;z-index:3;"></div>
  <div id="iw-panel" style="position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,rgba(16,5,2,.97),rgba(8,2,1,.99));border-top:1px solid rgba(176,112,64,.2);border-radius:20px 20px 0 0;padding:20px 24px 44px;z-index:20;transform:translateY(100%);transition:transform .35s cubic-bezier(.25,.46,.45,.94);max-height:72vh;overflow-y:auto;"></div>

  <!-- MEDITATION IMMERSIVE OVERLAY -->
  <div id="med-overlay" style="
    position:absolute;inset:0;
    background:rgba(1,3,2,0);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:30;opacity:0;pointer-events:none;
    transition:opacity .8s ease, background .8s ease;">

    <!-- Duration selector — fades out when running -->
    <div id="med-dur-row" style="
      position:absolute;top:60px;left:0;right:0;
      display:flex;justify-content:center;gap:10px;
      transition:opacity .6s ease;">
      <div class="med-dur-pill" data-min="5"  style="padding:6px 18px;border-radius:20px;border:1px solid rgba(196,160,255,.2);color:rgba(196,160,255,.4);font-size:10px;letter-spacing:.14em;cursor:pointer;transition:all .2s;">5 min</div>
      <div class="med-dur-pill" data-min="10" style="padding:6px 18px;border-radius:20px;border:1px solid rgba(196,160,255,.3);color:rgba(196,160,255,.6);font-size:10px;letter-spacing:.14em;cursor:pointer;transition:all .2s;">10 min</div>
      <div class="med-dur-pill" data-min="20" style="padding:6px 18px;border-radius:20px;border:1px solid rgba(196,160,255,.2);color:rgba(196,160,255,.4);font-size:10px;letter-spacing:.14em;cursor:pointer;transition:all .2s;">20 min</div>
    </div>

    <!-- Breathing orb -->
    <div id="med-orb-wrap" style="position:relative;display:flex;align-items:center;justify-content:center;width:200px;height:200px;">
      <!-- Outer glow ring — animates with breath -->
      <div id="med-ring" style="
        position:absolute;inset:0;border-radius:50%;
        border:1px solid rgba(196,160,255,.14);
        box-shadow:0 0 0 0 rgba(196,160,255,.0);
        transition:transform 1s ease, box-shadow 1s ease;"></div>
      <!-- Core orb -->
      <div id="med-orb" style="
        width:96px;height:96px;border-radius:50%;
        background:radial-gradient(circle at 38% 36%, rgba(220,200,255,.18) 0%, rgba(196,160,255,.10) 40%, rgba(140,90,255,.06) 100%);
        border:1px solid rgba(196,160,255,.3);
        box-shadow:0 0 28px 8px rgba(160,110,255,.22), 0 0 60px 20px rgba(140,90,255,.10);
        transition:transform 1s ease, box-shadow 1s ease, opacity .6s ease;"></div>
    </div>

    <!-- Breath cue text -->
    <div id="med-cue" style="
      margin-top:32px;
      color:rgba(196,160,255,.45);font-size:13px;letter-spacing:.18em;
      text-transform:uppercase;text-align:center;
      transition:opacity .8s ease;min-height:20px;">tap to begin</div>

    <!-- Timer — whisper at bottom -->
    <div id="med-timer" style="
      position:absolute;bottom:72px;left:50%;transform:translateX(-50%);
      color:rgba(196,160,255,.22);font-size:32px;font-weight:200;
      letter-spacing:.06em;font-variant-numeric:tabular-nums;
      transition:opacity .4s ease;">5:00</div>

    <!-- Close hint -->
    <div id="med-close-hint" style="
      position:absolute;bottom:32px;left:50%;transform:translateX(-50%);
      color:rgba(196,160,255,.14);font-size:9px;letter-spacing:.22em;
      text-transform:uppercase;white-space:nowrap;cursor:pointer;">tap anywhere to close</div>
  </div>
</div>

<!-- ARRIVAL SCREEN -->
<div id="arrival-screen" style="position:fixed;inset:0;z-index:700;background:#080503;opacity:0;pointer-events:none;transition:opacity .9s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;">
  <canvas id="arrival-fire-canvas" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-58%);pointer-events:none;z-index:1;opacity:.55;"></canvas>
  <div id="arrival-content" style="position:relative;z-index:2;width:100%;max-width:400px;padding:0 36px;box-sizing:border-box;transition:opacity .55s ease,transform .55s ease;"></div>
</div>

<!-- UNIVERSAL IMMERSIVE PANEL -->
<div id="immersive-panel" style="
  position:fixed;inset:0;z-index:500;
  background:rgba(1,4,2,0);
  opacity:0;pointer-events:none;
  transition:opacity .65s ease, background .65s ease;
  display:flex;flex-direction:column;align-items:stretch;">
  <div id="imp-content" style="
    flex:1;overflow-y:auto;
    padding:56px 28px 96px;

    position:absolute;bottom:28px;left:50%;transform:translateX(-50%);
    color:rgba(255,255,255,.1);font-size:9px;letter-spacing:.24em;
    text-transform:uppercase;white-space:nowrap;cursor:pointer;user-select:none;">
    tap anywhere to close</div>
</div>

  // ── FOREST RING ───────────────────────────────────────────────────────
  function drawForestOn(canvasId, outerR, cx, cy) {
    const canvas = document.getElementById(canvasId);
    canvas.width  = innerWidth;
    canvas.height = innerHeight;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, innerWidth, innerHeight);

    const treeCount = Math.round(outerR * 0.38);
    const treeH     = outerR * 0.22;   // tree height relative to ring radius
    const treeW     = treeH * 0.52;
    const trunkH    = treeH * 0.28;
    const trunkW    = treeW * 0.18;

    for (let i = 0; i < treeCount; i++) {
      // Spread trees slightly randomly around the ring
      const baseAngle = (2 * Math.PI / treeCount) * i;
      const jitter    = (Math.random() - 0.5) * (2 * Math.PI / treeCount) * 0.6;
      const angle     = baseAngle + jitter;

      // Vary distance slightly so trees feel organic, not mechanical
      const r   = outerR + treeH * (0.12 + Math.random() * 0.32);
      const tx  = cx + Math.cos(angle) * r;
      const ty  = cy + Math.sin(angle) * r;

      // Vary size slightly per tree
      const scale = 0.72 + Math.random() * 0.56;
      const th    = treeH * scale;
      const tw    = treeW * scale;
      const trH   = trunkH * scale;
      const trW   = trunkW * scale;

      // Depth cue — trees further from fire glow slightly dimmer
      const alpha = 0.18 + Math.random() * 0.22;

      ctx.save();
      ctx.translate(tx, ty);
      ctx.rotate(angle + Math.PI / 2); // roots face outward from center

      // Trunk
      ctx.fillStyle = `rgba(60,30,8,${alpha * 0.9})`;
      ctx.fillRect(-trW / 2, 0, trW, trH);

      // Three stacked triangles (classic pine silhouette)
      const layers = 3;
      for (let l = 0; l < layers; l++) {
        const lScale  = 1 - l * 0.22;
        const lW      = tw * lScale;
        const lH      = th * 0.42 * lScale;
        const lY      = trH + (th * 0.18 * l) - lH * 0.15;
        const fireGlow = l === 0 ? alpha * 0.15 : 0; // bottom layer catches faint orange

        // Pine canopy — dark green with faint amber base glow
        ctx.beginPath();
        ctx.moveTo(0, -(lY + lH));
        ctx.lineTo(-lW / 2, -lY);
        ctx.lineTo(lW / 2,  -lY);
        ctx.closePath();
        ctx.fillStyle = `rgba(${30 + Math.round(fireGlow * 200)},${55 + Math.round(l * 8)},${18},${alpha})`;
        ctx.fill();

        // Subtle edge highlight
        ctx.strokeStyle = `rgba(80,${140 + l * 10},50,${alpha * 0.4})`;
        ctx.lineWidth   = 0.5;
        ctx.stroke();
      }

      ctx.restore();
    }

    // Soft ambient glow just inside the tree ring — fire light on the forest floor
    const grad = ctx.createRadialGradient(cx, cy, outerR * 0.82, cx, cy, outerR * 1.18);
    grad.addColorStop(0,   'rgba(255,100,20,0.00)');
    grad.addColorStop(0.4, 'rgba(255,80,15,0.045)');
    grad.addColorStop(1,   'rgba(255,60,10,0.00)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, innerWidth, innerHeight);
  }

  // ── HOME LAYOUT ───────────────────────────────────────────────────────
  function layout() {
    const vmin     = Math.min(innerWidth, innerHeight);
    const ringDiam = vmin * 0.78;
    const ringR    = ringDiam / 2;
    const aSize    = ringDiam / 6 * 0.7;
    const fSize    = Math.max(10, aSize * 0.28);
    const cx = innerWidth / 2, cy = innerHeight / 2;

    const ring = document.getElementById('orbit-ring');
    ring.style.width = ring.style.height = ringDiam + 'px';

    // Outer ring + tap zone
    const outerDiam = ringDiam * 1.58;
    document.getElementById('outer-ring').style.width =
    document.getElementById('outer-ring').style.height = outerDiam + 'px';

    // Full-screen tap area — only fires if click lands outside the outer ring
    const outerTap = document.getElementById('outer-tap');
    const outerR = outerDiam / 2;
    outerTap.onmousemove = e => {
      const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
      outerTap.classList.toggle('forest-hover', dist > outerR);
    };
    outerTap.onmouseleave = () => outerTap.classList.remove('forest-hover');
    outerTap.onclick = e => {
      const ip = document.getElementById('immersive-panel');
      if (ip && ip.style.pointerEvents === 'all') { closeImmersivePanel(); return; }
      if (fireLogsOpen) { fireLogsOpen = false; document.getElementById('fire-logs').classList.remove('logs-visible'); return; }
      const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
      if (dist > outerR) transitionToDiscovery();
    };

    drawForestOn('forest-canvas', outerDiam / 2, cx, cy);

    const center = document.getElementById('center');
    const cs = aSize * 2.4;
    center.style.width = center.style.height = cs + 'px';
    center.onclick = e => { e.stopPropagation(); toggleFireLogs(); };
    initFireCanvas(Math.round(cs));
    buildFireLogs(cx, cy, cs);

    const container = document.getElementById('avatars');
    container.innerHTML = '';
    USERS.forEach((user, i) => {
      const angle = -Math.PI / 2 + (2 * Math.PI / USERS.length) * i;
      const x = cx + ringR * Math.cos(angle), y = cy + ringR * Math.sin(angle);

      const wrap = document.createElement('div');
      wrap.className = 'avatar';
      wrap.style.left = x + 'px'; wrap.style.top = y + 'px';

      const circle = document.createElement('div');
      circle.className = 'avatar-circle' + (user.isMe ? ' me' : '');
      circle.style.cssText = `width:${aSize}px;height:${aSize}px;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;`;
      circle.innerHTML = makeAvatarSvg(user, aSize);
      circle.onclick = e => {
        e.stopPropagation();
        if (user.isMe) { openPage('innerwork'); } else { showMemberProfile(user); }
      };

      const label = document.createElement('div');
      label.className = 'avatar-label';
      label.style.fontSize = fSize + 'px';
      label.textContent = user.name;

      wrap.addEventListener('click', e => e.stopPropagation());
      wrap.appendChild(circle);
      wrap.appendChild(label);
      container.appendChild(wrap);
    });
  }

    const now = new Date();
    return EVENTS.some(ev => {

      return d - now >= 0 && d - now < 86400000;
    });

  function buildFireLogs(cx, cy, fireSize) {
    const container = document.getElementById('fire-logs');

      { label: 'Chat',      icon: '💬', type: 'chat',      angle:  Math.PI * 0.70 },
    ];

    logs.forEach(log => {
      const lx = Math.cos(log.angle) * baseR;
      const ly = Math.sin(log.angle) * baseR;

      const wrap = document.createElement('div');
      wrap.className = 'fire-log';
      wrap.style.left = lx + 'px';
      wrap.style.top  = ly + 'px';

      const dot = document.createElement('div');

      if (isInvite) lbl.style.color = 'rgba(196,160,255,.35)';

      if (hasN) lbl.style.color = 'rgba(255,200,80,.45)';
      lbl.textContent = log.label;

      wrap.appendChild(dot);
      wrap.appendChild(lbl);
      wrap.onclick = e => { e.stopPropagation(); openHomePanel(log.type); };
      container.appendChild(wrap);
    });

  // ── ARRIVAL SCREEN ────────────────────────────────────────────────────
  let arrivalFireRAF = null;

  function openArrivalScreen(inviteeName, inviter) {

    function showWelcome(answers) {

  function runArrivalFire(canvas) {
    const ctx = canvas.getContext('2d');
    const sz = canvas.width, cx = sz / 2, cy = sz / 2, r = sz * 0.085;
    function turb(t, s) { return Math.sin(t*.52+s)*.9 + Math.sin(t*.97+s*1.31)*.4; }
    function flame(t, ox, w, h, stops, s) {
      const wb = turb(t,s)*r*.045, wt = turb(t,s+1.57)*r*.07;
      const by = cy+r*.38, ty = by-h, tx = cx+ox+wt, my = by-h*.52, mx = cx+ox+wb;
      ctx.beginPath();
      ctx.moveTo(cx-w+ox+wb, by);
      ctx.quadraticCurveTo(mx-w*.5, my, tx, ty);
      ctx.quadraticCurveTo(mx+w*.5, my, cx+w+ox+wb, by);
      ctx.closePath();
      const g = ctx.createLinearGradient(cx+ox, by, tx, ty);
      stops.forEach(([sp,c]) => g.addColorStop(sp, c));
      ctx.fillStyle = g; ctx.fill();
    }
    function frame() {
      ctx.clearRect(0,0,sz,sz);
      const t = performance.now()/1000;
      flame(t,0,r*.28,r*1.3,  [[0,'rgba(180,55,0,.32)'],[.55,'rgba(220,90,10,.16)'],[1,'rgba(255,140,20,0)']],0);
      flame(t,0,r*.17,r*.92,  [[0,'rgba(255,140,20,.40)'],[.45,'rgba(255,180,40,.22)'],[1,'rgba(255,220,80,0)']],0.9);
      flame(t,0,r*.09,r*.62,  [[0,'rgba(255,210,90,.48)'],[.50,'rgba(255,190,55,.22)'],[1,'rgba(255,240,160,0)']],2.1);
      const grd = ctx.createRadialGradient(cx,cy+r*.1,r*.2,cx,cy,r*3.2);
      grd.addColorStop(0,'rgba(255,80,15,0.022)'); grd.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=grd; ctx.fillRect(0,0,sz,sz);
      arrivalFireRAF = requestAnimationFrame(frame);
    }
    frame();
  }


  // ── FIRE CANVAS ───────────────────────────────────────────────────────
  let fireRAF = null;

  function initFireCanvas(fireSize) {
    const sz = Math.round(fireSize * 3.2);
    let canvas = document.getElementById('fire-canvas');
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.id = 'fire-canvas';
      document.getElementById('home').appendChild(canvas);
    }
    // Clear any old content from #center (previous emoji / canvas)
    const center = document.getElementById('center');
    center.innerHTML = '';

    canvas.width = canvas.height = sz;
    canvas.style.width = canvas.style.height = sz + 'px';

    if (fireRAF) cancelAnimationFrame(fireRAF);
    animateFire(canvas, fireSize);
  }

  function animateFire(canvas, fireSize) {
    const ctx = canvas.getContext('2d');
    const sz  = canvas.width;
    const cx  = sz / 2;
    const cy  = sz / 2;
    const r   = fireSize / 2;

    // Gentle turbulence — only two slow harmonics
    function turb(t, seed) {
      return Math.sin(t * 0.52 + seed)        * 1.0
           + Math.sin(t * 0.97 + seed * 1.31) * 0.45;
    }

    function roundedRect(x, y, w, h, rad) {
      ctx.beginPath();
      ctx.moveTo(x + rad, y);
      ctx.lineTo(x + w - rad, y);
      ctx.arcTo(x + w, y,     x + w, y + h, rad);
      ctx.lineTo(x + w, y + h - rad);
      ctx.arcTo(x + w, y + h, x,     y + h, rad);
      ctx.lineTo(x + rad, y + h);
      ctx.arcTo(x,     y + h, x,     y,     rad);
      ctx.lineTo(x, y + rad);
      ctx.arcTo(x,     y,     x + w, y,     rad);
      ctx.closePath();
    }

    function drawFlame(t, offX, width, height, colors, seed, wind) {
      const wob  = turb(t, seed)        * r * 0.045;
      const wobT = turb(t, seed + 1.57) * r * 0.07;
      const wBase = wind * r * 0.025;
      const wTip  = wind * r * 0.10;

      const baseY = cy + r * 0.38;
      const tipY  = baseY - height;
      const tipX  = cx + offX + wobT + wTip;
      const midY  = baseY - height * 0.52;
      const midX  = cx + offX + wob + wBase;
      const lx    = cx - width + offX + wob + wBase;
      const rx    = cx + width + offX + wob + wBase;

      ctx.beginPath();
      ctx.moveTo(lx, baseY);
      ctx.quadraticCurveTo(midX - width * 0.5, midY, tipX, tipY);
      ctx.quadraticCurveTo(midX + width * 0.5, midY, rx,   baseY);
      ctx.closePath();

      const grad = ctx.createLinearGradient(cx + offX, baseY, tipX, tipY);
      colors.forEach(([stop, col]) => grad.addColorStop(stop, col));
      ctx.fillStyle = grad;
      ctx.fill();
    }

    function drawFrame() {
      try {
        ctx.clearRect(0, 0, sz, sz);
        const t = performance.now() / 1000;

        // Community state affects fire character
        const eventGlow  = hasUpcomingEvent() ? 1.0 : 0.0;   // brighter, taller
        const chatFlicker = chatRecentlyActive ? 1.0 : 0.0;   // more turbulence

        // Wind — more restless when chat is active
        const windBase = Math.sin(t * 0.18) * 0.28 + Math.sin(t * 0.43) * 0.14;
        const wind = windBase * (1 + chatFlicker * 0.6);

        // ── Clip logs/embers to fire circle, flames rise freely above ──
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.clip();

        // Logs
        const logY = cy + r * 0.50, logH = r * 0.16;
        ctx.save();
        ctx.translate(cx - r * 0.12, logY); ctx.rotate(-0.32);
        const lg1 = ctx.createLinearGradient(0, -logH/2, 0, logH/2);
        lg1.addColorStop(0, '#5c3010'); lg1.addColorStop(1, '#2a1206');
        ctx.fillStyle = lg1;
        roundedRect(-r * 0.36, -logH/2, r * 0.72, logH, 4); ctx.fill();
        ctx.restore();
        ctx.save();
        ctx.translate(cx + r * 0.12, logY); ctx.rotate(0.32);
        const lg2 = ctx.createLinearGradient(0, -logH/2, 0, logH/2);
        lg2.addColorStop(0, '#4e2a0e'); lg2.addColorStop(1, '#1e0d04');
        ctx.fillStyle = lg2;
        roundedRect(-r * 0.36, -logH/2, r * 0.72, logH, 4); ctx.fill();
        ctx.restore();

        // Ember glow — slow, soft pulse
        const ep = 0.28 + 0.08 * Math.sin(t * 1.8 + turb(t, 5) * 0.4);
        const eg = ctx.createRadialGradient(cx, logY - logH * 0.3, 0, cx, logY, r * 0.48);
        eg.addColorStop(0, `rgba(255,120,10,${ep})`);
        eg.addColorStop(1, 'rgba(255,50,0,0)');
        ctx.fillStyle = eg;
        ctx.beginPath(); ctx.ellipse(cx, logY, r * 0.46, r * 0.22, 0, 0, Math.PI * 2); ctx.fill();

        ctx.restore(); // end base clip — flames draw freely above

        // Community state scales flame height and opacity
        const fh = 1 + eventGlow * 0.28; // taller when event is upcoming
        const fo = 1 + eventGlow * 0.18; // brighter

        // Outer flame body — warm amber, fairly transparent
        drawFlame(t, 0,     r*.32, r*1.40*fh, [[0,`rgba(180,55,0,${.55*fo})`],[.55,`rgba(220,90,10,${.30*fo})`],[1,'rgba(255,140,20,0)']], 0.0,  wind);
        drawFlame(t,-r*.09, r*.24, r*1.18*fh, [[0,`rgba(190,60,0,${.48*fo})`],[.60,`rgba(225,95,10,${.25*fo})`],[1,'rgba(255,145,20,0)']], 1.73, wind);
        drawFlame(t, r*.08, r*.22, r*1.10*fh, [[0,`rgba(185,58,0,${.45*fo})`],[.65,`rgba(218,88,8,${.22*fo})`],[1,'rgba(255,140,18,0)']], 3.07, wind);
        // Inner warm core
        drawFlame(t, 0,     r*.20, r*1.00*fh, [[0,`rgba(255,140,20,${.70*fo})`],[.45,`rgba(255,180,40,${.45*fo})`],[1,'rgba(255,220,80,0)']], 0.9, wind);
        // Bright tip
        drawFlame(t, 0,     r*.10, r*.70*fh,  [[0,`rgba(255,210,90,${.80*fo})`],[.50,`rgba(255,190,55,${.40*fo})`],[1,'rgba(255,240,160,0)']], 2.1, wind);

        // Soft ambient glow — warmer when event upcoming
        const glowA = (0.038 + eventGlow * 0.028) + 0.012 * Math.sin(t * 1.4);
        const glow  = ctx.createRadialGradient(cx, cy + r * 0.1, r * 0.2, cx, cy, r * 1.4);
        glow.addColorStop(0,   'rgba(255,100,20,0)');
        glow.addColorStop(0.5, `rgba(255,80,15,${glowA})`);
        glow.addColorStop(1,   'rgba(255,40,0,0)');
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(cx, cy, r * 1.4, 0, Math.PI * 2); ctx.fill();

      } catch(e) { console.error('fire draw error:', e); }
      fireRAF = requestAnimationFrame(drawFrame);
    }

    drawFrame();
  }

  // ── AVATAR SVG + MEMBER PROFILE ──────────────────────────────────────
  function makeAvatarSvg(user, size) {
    if (user.avatar === 'snoopy') {
      return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="28" cy="38" rx="18" ry="26" fill="#8B5E3C" transform="rotate(-15 28 38)"/>
        <ellipse cx="72" cy="38" rx="18" ry="26" fill="#8B5E3C" transform="rotate(15 72 38)"/>
        <circle cx="50" cy="54" r="34" fill="#f5f5f0"/>
        <circle cx="40" cy="48" r="4" fill="#222"/>
        <circle cx="60" cy="48" r="4" fill="#222"/>
        <ellipse cx="50" cy="63" rx="7" ry="5" fill="#222"/>
      </svg>`;
    }
    const initials = user.name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
    return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="50" fill="#2a1a08"/>
      <text x="50" y="58" text-anchor="middle" font-size="34" font-family="sans-serif" fill="#b07040">${initials}</text>
    </svg>`;
  }

  function showMemberProfile(user) {
    const sz = 64;
    openImmersivePanel(`
      <div style="display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:16px;">
        <div style="width:${sz}px;height:${sz}px;border-radius:50%;border:1px solid rgba(176,112,64,.22);overflow:hidden;margin-bottom:16px;">${makeAvatarSvg(user, sz)}</div>
        <div style="color:#d8a060;font-size:20px;letter-spacing:.06em;margin-bottom:5px;">${user.name}</div>
        <div style="color:rgba(176,112,64,.3);font-size:9px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:22px;">${user.role || 'Circle Member'}</div>
        <p style="color:rgba(200,144,78,.65);font-size:15px;line-height:1.8;font-weight:300;margin-bottom:32px;max-width:300px;">${user.bio || ''}</p>
        <div id="imp-msg-btn" style="padding:12px 32px;border:1px solid rgba(176,112,64,.22);border-radius:24px;color:rgba(176,112,64,.55);font-size:10px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;">Send a Message</div>
      </div>
    `);
  }

  // ── DISCOVERY ─────────────────────────────────────────────────────────
  let discFilter = 'all';

  function buildDiscovery() {
    const canvas  = document.getElementById('disc-canvas');
    const content = document.getElementById('disc-content');
    canvas.width = innerWidth; canvas.height = innerHeight;
    content.innerHTML = '';

    const ctx  = canvas.getContext('2d');
    ctx.clearRect(0, 0, innerWidth, innerHeight);

    const vmin  = Math.min(innerWidth, innerHeight);
    const cx    = innerWidth / 2;
    const cy    = innerHeight / 2;
    const maxR  = vmin * 0.38;
    const outerD = vmin * 0.72 * 1.58;

    // Forest outer ring — same template
    document.getElementById('disc-outer-ring').style.width =
    document.getElementById('disc-outer-ring').style.height = outerD + 'px';
    drawForestOn('disc-forest-canvas', outerD / 2, cx, cy);

    // Forest tap → back to Cosmic (via disc-content, which sits above outer-tap)
    const outerR = outerD / 2;
    content.onmousemove = e => {
      const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
      content.style.cursor = dist > outerR ? 'pointer' : 'default';
    };
    content.onmouseleave = () => { content.style.cursor = 'default'; };
    content.onclick = e => {
      const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
      if (dist > outerR) transitionFromDiscovery();
    };

    // Proximity rings
    [0.34, 0.67, 1.0].forEach((scale, i) => {
      ctx.beginPath();
      ctx.arc(cx, cy, maxR * scale, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(176,112,64,${0.07 - i * 0.015})`;
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 9]);
      ctx.stroke();
      ctx.setLineDash([]);
    });

    // Connection lines
    const toXY = c => c.isMe
      ? [cx, cy]
      : [cx + Math.cos((c.angle - 90) * Math.PI / 180) * c.dist * maxR,
         cy + Math.sin((c.angle - 90) * Math.PI / 180) * c.dist * maxR];

    CONNECTIONS.forEach(([a, b]) => {
      const ca = COMMUNITIES.find(c => c.id === a);
      const cb = COMMUNITIES.find(c => c.id === b);
      if (!ca || !cb) return;
      const [ax, ay] = toXY(ca), [bx, by] = toXY(cb);
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
      ctx.strokeStyle = 'rgba(176,112,64,.06)';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    });

    // Filter bar
    const filterBar = document.getElementById('disc-filter');
    filterBar.style.bottom = '76px'; // sit above My Circles button
    filterBar.innerHTML = '';
    [['all','All'],['land','Land'],['healing','Healing'],['arts','Arts'],['story','Story']].forEach(([val, label]) => {
      const pill = document.createElement('div');
      pill.className = 'disc-pill' + (discFilter === val ? ' active' : '');
      pill.textContent = label;
      pill.onclick = e => { e.stopPropagation(); discFilter = val; buildDiscovery(); };
      filterBar.appendChild(pill);
    });

    // My Circles button
    document.getElementById('disc-my-circles-btn').onclick = e => {
      e.stopPropagation();
      openMyCirclesPanel();
    };

    function openMyCirclesPanel() {
      const me = USERS.find(u => u.isMe);
      const circles = me ? me.circles.filter(c => !c.create) : [];
      openImmersivePanel(`
        <div style="color:rgba(176,112,64,.28);font-size:10px;letter-spacing:.22em;text-transform:uppercase;text-align:center;margin-bottom:28px;">My Circles</div>
        ${circles.map(c => `
          <div style="display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid rgba(176,112,64,.07);cursor:pointer;">
            <div style="font-size:22px;width:32px;text-align:center;">${c.icon}</div>
            <div style="color:#d8a060;font-size:15px;flex:1;">${c.label}</div>
            <div style="color:rgba(176,112,64,.22);font-size:20px;">›</div>
          </div>`).join('')}
        <div id="create-circle-btn" style="display:flex;align-items:center;gap:16px;padding:16px 0;cursor:pointer;">
          <div style="width:32px;text-align:center;color:rgba(196,160,255,.45);font-size:18px;">✦</div>
          <div style="color:rgba(196,160,255,.5);font-size:14px;letter-spacing:.06em;">Create a Circle</div>
        </div>
      `, () => {
        const btn = document.getElementById('create-circle-btn');
        if (btn) btn.onclick = e => { e.stopPropagation(); openCreateCircleFlow(); };
      });
    }

    function openCreateCircleFlow(step, data) {
      step = step || 1;
      data = data || {};
      const CIRCLE_TYPES = [
        { key: 'land',    label: 'Land & Stewardship', icon: '🌿' },
        { key: 'healing', label: 'Healing Arts',        icon: '🌸' },
        { key: 'arts',    label: 'Creative Arts',       icon: '🎨' },
        { key: 'story',   label: 'Story & Memory',      icon: '🔥' },
        { key: 'ohana',   label: 'ʻOhana / Family',     icon: '🌺' },
      ];

      if (step === 1) {
        openImmersivePanel(`
          <div style="color:rgba(196,160,255,.22);font-size:9px;letter-spacing:.24em;text-transform:uppercase;text-align:center;margin-bottom:8px;">New Circle · 1 of 3</div>
          <div style="color:rgba(196,160,255,.55);font-size:20px;font-weight:200;text-align:center;margin-bottom:36px;line-height:1.45;">What do you name<br>this circle?</div>
          <input id="cc-name" type="text" placeholder="Circle name…" style="width:100%;background:transparent;border:none;border-bottom:1px solid rgba(196,160,255,.2);padding:10px 0;color:#d8a060;font-size:20px;font-weight:200;outline:none;font-family:inherit;box-sizing:border-box;text-align:center;">
          <div style="text-align:center;margin-top:40px;">
            <div id="cc-next1" style="display:inline-block;padding:11px 36px;border:1px solid rgba(196,160,255,.22);border-radius:24px;color:rgba(196,160,255,.5);font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;">Continue</div>
          </div>
        `, () => {
          const next = document.getElementById('cc-next1');
          if (next) next.onclick = e => {
            e.stopPropagation();
            const name = (document.getElementById('cc-name').value || '').trim();
            if (!name) { document.getElementById('cc-name').style.borderBottomColor = 'rgba(255,100,80,.4)'; return; }
            openCreateCircleFlow(2, { ...data, name });
          };
        });

      } else if (step === 2) {
        openImmersivePanel(`
          <div style="color:rgba(196,160,255,.22);font-size:9px;letter-spacing:.24em;text-transform:uppercase;text-align:center;margin-bottom:8px;">New Circle · 2 of 3</div>
          <div style="color:rgba(196,160,255,.55);font-size:20px;font-weight:200;text-align:center;margin-bottom:32px;line-height:1.45;">What kind of circle<br>is ${data.name}?</div>
          ${CIRCLE_TYPES.map(t => `
            <div class="cc-type-row" data-key="${t.key}" style="display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid rgba(196,160,255,.07);cursor:pointer;">
              <div style="font-size:20px;width:32px;text-align:center;">${t.icon}</div>
              <div style="color:rgba(196,160,255,.5);font-size:14px;flex:1;">${t.label}</div>
              <div class="cc-check" style="color:rgba(196,160,255,.0);font-size:14px;">✓</div>
            </div>`).join('')}
          <div style="text-align:center;margin-top:28px;">
            <div id="cc-next2" style="display:inline-block;padding:11px 36px;border:1px solid rgba(196,160,255,.22);border-radius:24px;color:rgba(196,160,255,.5);font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;opacity:.4;pointer-events:none;">Continue</div>
          </div>
        `, () => {
          let selectedType = null;
          document.querySelectorAll('.cc-type-row').forEach(row => {
            row.onclick = e => {
              e.stopPropagation();
              selectedType = row.dataset.key;
              document.querySelectorAll('.cc-type-row').forEach(r => {
                const active = r.dataset.key === selectedType;
                r.querySelector('.cc-check').style.color = active ? 'rgba(196,160,255,.6)' : 'rgba(196,160,255,.0)';
                r.querySelector('div:nth-child(2)').style.color = active ? 'rgba(196,160,255,.85)' : 'rgba(196,160,255,.5)';
              });
              const next = document.getElementById('cc-next2');
              if (next) { next.style.opacity = '1'; next.style.pointerEvents = 'all'; }
            };
          });
          const next = document.getElementById('cc-next2');
          if (next) next.onclick = e => {
            e.stopPropagation();
            if (!selectedType) return;
            openCreateCircleFlow(3, { ...data, type: selectedType });
          };
        });

      } else if (step === 3) {
        openImmersivePanel(`
          <div style="color:rgba(196,160,255,.22);font-size:9px;letter-spacing:.24em;text-transform:uppercase;text-align:center;margin-bottom:8px;">New Circle · 3 of 3</div>
          <div style="color:rgba(196,160,255,.55);font-size:20px;font-weight:200;text-align:center;margin-bottom:32px;line-height:1.45;">What is the soul<br>of this circle?</div>
          <textarea id="cc-desc" placeholder="A sentence or two about what you're tending together…" style="width:100%;min-height:120px;background:transparent;border:none;border-bottom:1px solid rgba(196,160,255,.18);padding:10px 0;color:#d8a060;font-size:15px;line-height:1.7;outline:none;font-family:inherit;resize:none;box-sizing:border-box;text-align:center;"></textarea>
          <div style="text-align:center;margin-top:36px;">
            <div id="cc-create" style="display:inline-block;padding:12px 40px;border:1px solid rgba(196,160,255,.28);border-radius:28px;color:rgba(196,160,255,.6);font-size:10px;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;">Birth the Circle</div>
          </div>
        `, () => {
          const btn = document.getElementById('cc-create');
          if (btn) btn.onclick = e => {
            e.stopPropagation();
            const desc = (document.getElementById('cc-desc').value || '').trim() || 'A new circle finding its form.';
            const typeData = CIRCLE_TYPES.find(t => t.key === data.type) || CIRCLE_TYPES[0];
            const newCircle = { label: data.name, icon: typeData.icon, primary: false };
            const me = USERS.find(u => u.isMe);
            if (me) me.circles.push(newCircle);
            const newComm = {
              id: 'user-' + Date.now(),
              name: data.name,
              type: data.type,
              desc,
              members: 1,
              isMe: false,
              dist: 0.25,
              angle: Math.round(Math.random() * 360),
            };
            COMMUNITIES.push(newComm);
            openImmersivePanel(`
              <div style="text-align:center;padding-top:32px;">
                <div style="font-size:48px;margin-bottom:24px;">${typeData.icon}</div>
                <div style="color:#d8a060;font-size:22px;font-weight:200;margin-bottom:10px;">${data.name}</div>
                <div style="color:rgba(176,112,64,.3);font-size:12px;line-height:1.8;margin-bottom:36px;">Your circle has been kindled.<br>Invite others to join the fire.</div>
                <div id="cc-done" style="display:inline-block;padding:11px 32px;border:1px solid rgba(176,112,64,.22);border-radius:24px;color:rgba(176,112,64,.55);font-size:10px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;">Done</div>
              </div>
            `, () => {
              const done = document.getElementById('cc-done');
              if (done) done.onclick = e => { e.stopPropagation(); closeImmersivePanel(); };
            });
          };
        });
      }
    }

    // Connect action nodes — ring just inside the forest
    const connectItems = [
      { label: 'Events',    icon: '🌟', type: 'events'    },
      { label: 'Meet Up',   icon: '🤝', type: 'meetup'    },
      { label: 'Gathering', icon: '🔥', type: 'gathering' },
      { label: 'New Ohana', icon: '🌺', type: 'ohana'     },
    ];
    connectItems.forEach((item, i) => {
      const angle = -Math.PI / 2 + (2 * Math.PI / connectItems.length) * i;
      const nr = outerR * 0.78;
      const nx = cx + Math.cos(angle) * nr;
      const ny = cy + Math.sin(angle) * nr;

      const wrap = document.createElement('div');
      wrap.style.cssText = `
        position:absolute;left:${nx}px;top:${ny}px;
        transform:translate(-50%,-50%);
        display:flex;flex-direction:column;align-items:center;gap:3px;
        cursor:pointer;z-index:5;`;

      const dot = document.createElement('div');
      dot.style.cssText = `
        width:34px;height:34px;border-radius:50%;
        background:rgba(4,8,28,.9);
        border:1px solid rgba(80,100,220,.22);
        box-shadow:0 0 12px 4px rgba(60,80,200,.15);
        display:flex;align-items:center;justify-content:center;
        font-size:14px;transition:box-shadow .2s,border-color .2s;`;
      dot.textContent = item.icon;

      const lbl = document.createElement('div');
      lbl.style.cssText = `
        color:rgba(100,120,255,.38);font-size:8px;letter-spacing:.12em;
        text-transform:uppercase;white-space:nowrap;pointer-events:none;`;
      lbl.textContent = item.label;

      wrap.appendChild(dot);
      wrap.appendChild(lbl);
      wrap.addEventListener('mouseenter', () => {
        dot.style.boxShadow = '0 0 18px 7px rgba(80,100,255,.28)';
        dot.style.borderColor = 'rgba(100,130,255,.42)';
      });
      wrap.addEventListener('mouseleave', () => {
        dot.style.boxShadow = '0 0 12px 4px rgba(60,80,200,.15)';
        dot.style.borderColor = 'rgba(80,100,220,.22)';
      });
      wrap.onclick = e => { e.stopPropagation(); openCosmicPanel(item.type); };
      content.appendChild(wrap);
    });

    // Community fires
    COMMUNITIES.forEach(comm => {
      const [x, y] = toXY(comm);
      const size   = comm.isMe ? 30 : Math.max(10, 7 + comm.members * 0.38);
      const active = discFilter === 'all' || comm.isMe || comm.type === discFilter;

      const fire = document.createElement('div');
      fire.className = 'comm-fire' + (active ? '' : ' dimmed');
      const gs = (size * 0.5).toFixed(1), gl = (size * 1.2).toFixed(1);
      fire.style.cssText = [
        `left:${x}px`, `top:${y}px`,
        `width:${size}px`, `height:${size}px`,
        `background:radial-gradient(circle,rgba(255,220,100,.95) 8%,rgba(255,120,20,.8) 50%,rgba(255,60,0,0) 100%)`,
        `box-shadow:0 0 ${gs}px ${(size*.2).toFixed(1)}px rgba(255,120,30,.6),0 0 ${gl}px ${(size*.4).toFixed(1)}px rgba(255,80,10,.25)`,
        `animation:hpulse ${(2.2 + Math.random() * 1.8).toFixed(2)}s ease-in-out infinite`,
        `animation-delay:-${(Math.random() * 3).toFixed(2)}s`,
      ].join(';');
      if (active) fire.onclick = e => { e.stopPropagation(); enterCommunityOhana(comm); };
      content.appendChild(fire);

      const lbl = document.createElement('div');
      lbl.className = 'comm-label' + (comm.isMe ? ' mine' : '') + (active ? '' : ' dimmed');
      lbl.style.left = x + 'px';
      lbl.style.top  = (y + size / 2 + 6) + 'px';
      lbl.textContent = comm.name;
      content.appendChild(lbl);
    });
  }

  function showDiscPanel(comm) {
    const typeLabel = { land:'Land & Stewardship', healing:'Healing Arts', arts:'Creative Arts', story:'Story & Memory' }[comm.type] || comm.type;
    openImmersivePanel(`
      <div style="text-align:center;padding-top:8px;">
        <div style="color:rgba(176,112,64,.28);font-size:10px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:6px;">${comm.name}</div>
        <div style="color:rgba(176,112,64,.18);font-size:9px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:28px;">${typeLabel}&nbsp;·&nbsp;${comm.members} members</div>
        <p style="color:rgba(200,144,78,.65);font-size:16px;line-height:1.8;font-weight:300;margin-bottom:36px;">${comm.desc}</p>
        ${comm.isMe
          ? `<div style="color:rgba(176,112,64,.22);font-size:9px;letter-spacing:.18em;text-transform:uppercase;">Your Circle</div>`
          : `<div id="disc-join-btn" style="display:inline-block;padding:12px 36px;border:1px solid rgba(176,112,64,.22);border-radius:24px;color:rgba(176,112,64,.55);font-size:10px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;">Request to Join</div>`
        }
      </div>
    `, () => {
      const joinBtn = document.getElementById('disc-join-btn');
      if (joinBtn) joinBtn.onclick = e => {
        e.stopPropagation();
        joinBtn.textContent = 'Request Sent ✓';
        joinBtn.style.opacity = '.4';
        joinBtn.style.pointerEvents = 'none';
      };
    });
  }

  function openManageMembership(comm) {
    const ROLES = ['Seeker', 'Land Steward', 'Healer', 'Story Keeper', 'Artist', 'Farmer', 'Elder', 'Fire Keeper'];
    const me = USERS.find(u => u.isMe);
    const currentRole = me.role || '';
    openImmersivePanel(`
      <div style="color:rgba(176,112,64,.28);font-size:10px;letter-spacing:.22em;text-transform:uppercase;text-align:center;margin-bottom:6px;">Membership</div>
      <div style="color:rgba(176,112,64,.16);font-size:9px;letter-spacing:.14em;text-transform:uppercase;text-align:center;margin-bottom:32px;">${comm.name}</div>

      <div style="margin-bottom:28px;">
        <div style="color:rgba(176,112,64,.28);font-size:9px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px;">Your role in this circle</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;">
          ${ROLES.map(r => `
            <div class="role-pill" data-role="${r}" style="padding:7px 14px;border-radius:20px;border:1px solid rgba(176,112,64,${currentRole===r?'.45':'.15'});color:rgba(176,112,64,${currentRole===r?'.75':'.35'});font-size:11px;cursor:pointer;transition:all .2s;">${r}</div>
          `).join('')}
        </div>
      </div>

      <div style="margin-bottom:32px;">
        <div style="color:rgba(176,112,64,.28);font-size:9px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px;">Your presence</div>
        <div style="display:flex;flex-direction:column;gap:0;">
          ${[
            { key:'active',  label:'Active',        sub:'Showing up and engaged'         },
            { key:'space',   label:'Taking Space',  sub:'Present but stepping back'      },
            { key:'away',    label:'Away',          sub:'Not available right now'         },
          ].map((s, i) => `
            <div class="presence-opt" data-status="${s.key}" style="display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid rgba(176,112,64,.07);cursor:pointer;">
              <div style="width:8px;height:8px;border-radius:50%;flex-shrink:0;background:${i===0?'rgba(100,200,100,.6)':i===1?'rgba(200,170,60,.5)':'rgba(150,150,150,.3)'}"></div>
              <div>
                <div style="color:#d8a060;font-size:14px;margin-bottom:2px;">${s.label}</div>
                <div style="color:rgba(176,112,64,.3);font-size:11px;">${s.sub}</div>
              </div>
              <div class="presence-check" style="margin-left:auto;color:rgba(176,112,64,.0);font-size:14px;">✓</div>
            </div>
          `).join('')}
        </div>
      </div>

      <div style="text-align:center;padding-top:4px;">
        <div id="mem-save-btn" style="display:inline-block;padding:11px 36px;border:1px solid rgba(176,112,64,.2);border-radius:24px;color:rgba(176,112,64,.45);font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;margin-bottom:24px;">Save</div>
        <div style="height:1px;background:rgba(176,112,64,.07);margin-bottom:24px;"></div>
        <div id="mem-leave-btn" style="color:rgba(255,80,80,.25);font-size:10px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:color .2s;">Leave this circle</div>
      </div>
    `, () => {
      let selectedRole = currentRole;
      let selectedStatus = 'active';

      // Role pills
      document.querySelectorAll('.role-pill').forEach(pill => {
        pill.onclick = e => {
          e.stopPropagation();
          selectedRole = pill.dataset.role;
          document.querySelectorAll('.role-pill').forEach(p => {
            const active = p.dataset.role === selectedRole;
            p.style.borderColor = active ? 'rgba(176,112,64,.45)' : 'rgba(176,112,64,.15)';
            p.style.color = active ? 'rgba(176,112,64,.75)' : 'rgba(176,112,64,.35)';
          });
        };
      });

      // Presence options
      document.querySelectorAll('.presence-opt').forEach(opt => {
        opt.onclick = e => {
          e.stopPropagation();
          selectedStatus = opt.dataset.status;
          document.querySelectorAll('.presence-opt').forEach(o => {
            o.querySelector('.presence-check').style.color =
              o.dataset.status === selectedStatus ? 'rgba(176,112,64,.55)' : 'rgba(176,112,64,.0)';
          });
        };
      });

      // Save
      const saveBtn = document.getElementById('mem-save-btn');
      if (saveBtn) saveBtn.onclick = e => {
        e.stopPropagation();
        if (selectedRole) me.role = selectedRole;
        saveBtn.textContent = 'Saved ✓';
        saveBtn.style.opacity = '.4';
        saveBtn.style.pointerEvents = 'none';
        setTimeout(() => closeImmersivePanel(), 700);
      };

      // Leave
      const leaveBtn = document.getElementById('mem-leave-btn');
      if (leaveBtn) {
        leaveBtn.onmouseenter = () => leaveBtn.style.color = 'rgba(255,80,80,.55)';
        leaveBtn.onmouseleave = () => leaveBtn.style.color = 'rgba(255,80,80,.25)';
        leaveBtn.onclick = e => {
          e.stopPropagation();
          leaveBtn.textContent = 'Are you sure? Tap again to leave.';
          leaveBtn.style.color = 'rgba(255,80,80,.6)';
          leaveBtn.onclick = e2 => {
            e2.stopPropagation();
            comm.isMe = false;
            closeImmersivePanel();
          };
        };
      }
    });
  }

  function enterCommunityOhana(comm) {
    document.getElementById('discovery').classList.remove('visible');
    document.getElementById('home').classList.remove('fade-out');
  }

  function transitionToDiscovery() {
    discFilter = 'all';
    buildDiscovery();
    document.getElementById('discovery').classList.add('visible');
    document.getElementById('home').classList.add('fade-out');
  }

  function transitionFromDiscovery() {
    document.getElementById('discovery').classList.remove('visible');
    openPage('innerwork');
  }

  // ── INNERWORK / ALOHA PAGE ────────────────────────────────────────────
  const CHAKRAS = [
    { id: 'crown',  label: 'Meditation',  color: '#c4a0ff', glow: 'rgba(160,120,255,.4)', type: 'meditation'  },
    { id: 'eye',    label: 'Journal',     color: '#8080ff', glow: 'rgba(80,80,255,.4)',   type: 'journal'     },
    { id: 'throat', label: 'Gratitude',   color: '#50b8ff', glow: 'rgba(40,140,255,.4)',  type: 'gratitude'   },
    { id: 'heart',  label: '',            color: '#60e060', glow: 'rgba(40,190,40,.5)',   type: 'global'      },
    { id: 'solar',  label: 'Commitments', color: '#f0d040', glow: 'rgba(210,170,20,.4)', type: 'commitments' },
    { id: 'sacral', label: 'Create',      color: '#ff9840', glow: 'rgba(230,120,20,.4)', type: 'create'      },
    { id: 'root',   label: 'Root',        color: '#ff6868', glow: 'rgba(200,50,50,.4)',  type: 'root'        },
  ];

  function buildInnerwork() {
    const vmin   = Math.min(innerWidth, innerHeight);
    const cx     = innerWidth / 2, cy = innerHeight / 2;
    const outerD = vmin * 1.14;
    const outerR = outerD / 2;

    document.getElementById('iw-outer-ring').style.width =
    document.getElementById('iw-outer-ring').style.height = outerD + 'px';
    drawForestOn('iw-forest-canvas', outerR, cx, cy);

    const outerTap = document.getElementById('iw-outer-tap');
    outerTap.onmousemove = e => {
      const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
      outerTap.style.cursor = dist > outerR ? 'pointer' : 'default';
    };
    outerTap.onmouseleave = () => outerTap.style.cursor = 'default';
    outerTap.onclick = e => {
      const overlay = document.getElementById('med-overlay');
      const medOpen = overlay && overlay.style.pointerEvents === 'all';
      if (medOpen) return;
      const ip = document.getElementById('immersive-panel');
      if (ip && ip.style.pointerEvents === 'all') { closeImmersivePanel(); return; }
      const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
      if (dist > outerR) { closePage('innerwork'); }
    };

    const ring = document.getElementById('iw-ring');
    ring.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;z-index:3;';
    ring.innerHTML = '';

    const chakraR = vmin * 0.21;  // radius of outer 6 nodes from center
    const nodeD   = vmin * 0.082;
    const heartD  = vmin * 0.13;
    const lblSize = Math.max(9, vmin * 0.023);

    // Angles: crown=top, then clockwise — eye, throat, root, sacral, solar
    // crown=top, eye=top-right, throat=top-left, root=bottom, sacral=bottom-left, solar=bottom-right
    const outerAngles = { crown: -90, eye: -30, throat: 210, root: 90, sacral: 150, solar: 30 };

    const pts = CHAKRAS.map(ch => {
      if (ch.id === 'heart') return { ch, x: cx, y: cy, d: heartD };
      const a = outerAngles[ch.id] * Math.PI / 180;
      return { ch, x: cx + Math.cos(a) * chakraR, y: cy + Math.sin(a) * chakraR, d: nodeD };
    });
    const byId = id => pts.find(p => p.ch.id === id);

    // SVG bolt
    const NS  = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible;';

    const defs = document.createElementNS(NS, 'defs');
    const grad = document.createElementNS(NS, 'linearGradient');
    grad.setAttribute('id', 'chakra-bolt');
    grad.setAttribute('gradientUnits', 'userSpaceOnUse');
    grad.setAttribute('x1', byId('root').x);  grad.setAttribute('y1', byId('root').y);
    grad.setAttribute('x2', byId('crown').x); grad.setAttribute('y2', byId('crown').y);
    [
      [0,    '#ff6868', .55],
      [0.17, '#ff9840', .5 ],
      [0.33, '#f0d040', .5 ],
      [0.5,  '#60e060', .65],
      [0.67, '#50b8ff', .5 ],
      [0.83, '#8080ff', .5 ],
      [1,    '#c4a0ff', .55],
    ].forEach(([off, color, op]) => {
      const stop = document.createElementNS(NS, 'stop');
      stop.setAttribute('offset', off);
      stop.setAttribute('stop-color', color);
      stop.setAttribute('stop-opacity', op);
      grad.appendChild(stop);
    });
    defs.appendChild(grad);
    svg.appendChild(defs);

    ring.appendChild(svg);

    // Chakra nodes — heart last so it renders on top at true center
    const sorted = [...pts].sort((a, b) => (a.ch.id === 'heart') - (b.ch.id === 'heart'));
    sorted.forEach(({ ch, x, y, d }) => {
      const isHeart = ch.id === 'heart';
      const ang     = outerAngles[ch.id] !== undefined ? outerAngles[ch.id] : 0;
      const cosA    = Math.cos(ang * Math.PI / 180);

      const chHasNotif = !isHeart && hasUnread(ch.type);
      const node = document.createElement('div');
      node.style.cssText = `
        position:absolute;left:${x}px;top:${y}px;
        transform:translate(-50%,-50%);
        width:${d}px;height:${d}px;border-radius:50%;
        background:rgba(2,8,3,.94);
        border:1px solid ${ch.color}44;
        box-shadow:0 0 ${isHeart ? 26 : 14}px ${isHeart ? 10 : 4}px ${ch.glow};
        display:flex;align-items:center;justify-content:center;
        cursor:pointer;z-index:2;`;

      const dot = document.createElement('div');
      dot.style.cssText = `
        width:${d * (isHeart ? 0.36 : 0.42)}px;
        height:${d * (isHeart ? 0.36 : 0.42)}px;
        border-radius:50%;background:${ch.color};
        opacity:${isHeart ? 0.9 : 0.65};pointer-events:none;
        ${isHeart ? 'animation:heartbeat 3s ease-in-out infinite;' : ''}`;
      node.appendChild(dot);

      if (ch.label) {
        const lbl = document.createElement('div');
        const onRight = cosA >= 0;
        lbl.style.cssText = `
          position:absolute;
          ${onRight
            ? `left:calc(50% + ${d * 0.64}px);text-align:left;`
            : `right:calc(50% + ${d * 0.64}px);text-align:right;`}
          top:50%;transform:translateY(-50%);
          color:${ch.color}80;font-size:${lblSize}px;
          letter-spacing:.14em;text-transform:uppercase;
          white-space:nowrap;pointer-events:none;`;
        lbl.textContent = ch.label;
        node.appendChild(lbl);
      }

      node.onclick = isHeart
        ? e => { e.stopPropagation(); closePage('innerwork'); transitionToDiscovery(); }
        : e => { e.stopPropagation(); openIntentionPanel(ch.type); };

      ring.appendChild(node);
    });

    // Communities floating on the outer ring
    const me      = USERS.find(u => u.isMe);
    const circles = me ? me.circles.filter(c => !c.create) : [];
    circles.forEach((circ, i) => {
      const angle = -Math.PI / 2 + (2 * Math.PI / circles.length) * i;
      const nx = cx + Math.cos(angle) * outerR * 0.84;
      const ny = cy + Math.sin(angle) * outerR * 0.84;

      const wrap = document.createElement('div');
      wrap.style.cssText = `
        position:absolute;left:${nx}px;top:${ny}px;
        transform:translate(-50%,-50%);
        display:flex;flex-direction:column;align-items:center;gap:3px;
        cursor:pointer;z-index:4;`;

      const fire = document.createElement('div');
      fire.style.cssText = `
        width:30px;height:30px;border-radius:50%;
        background:rgba(2,8,3,.92);border:1px solid rgba(80,180,80,.22);
        box-shadow:0 0 14px 5px rgba(50,150,50,.18);
        display:flex;align-items:center;justify-content:center;
        font-size:13px;transition:box-shadow .2s,border-color .2s;`;
      fire.textContent = circ.icon;

      const lbl = document.createElement('div');
      lbl.style.cssText = `
        color:rgba(80,180,80,.44);font-size:8px;letter-spacing:.12em;
        text-transform:uppercase;white-space:nowrap;pointer-events:none;`;
      lbl.textContent = circ.label;

      wrap.appendChild(fire);
      wrap.appendChild(lbl);
      wrap.addEventListener('mouseenter', () => {
        fire.style.boxShadow = '0 0 20px 8px rgba(70,200,70,.3)';
        fire.style.borderColor = 'rgba(90,210,90,.42)';
      });
      wrap.addEventListener('mouseleave', () => {
        fire.style.boxShadow = '0 0 14px 5px rgba(50,150,50,.18)';
        fire.style.borderColor = 'rgba(80,180,80,.22)';
      });
      wrap.onclick = e => { e.stopPropagation(); closePage('innerwork'); enterCommunityOhana(circ); };
      ring.appendChild(wrap);
    });
  }

  // ── INTENTION PANELS ─────────────────────────────────────────────────
  const DAILY_PROMPT = 'What are you bringing to the circle today?';

  const PLEDGES = [
    { text: 'Tend the lower garden', due: 'Tuesday morning' },
    { text: 'Bring flowers to evening circle', due: 'Tonight' },
    { text: 'Check in with Kaimana', due: 'This week' },
  ];

  function openIntentionPanel(type) {
    markNodeRead(type);
    if (type === 'journal') {
      function loadJournal() {
        try { return JSON.parse(localStorage.getItem('fc_journal') || '[]'); } catch(e) { return []; }
      }
      function saveJournalEntry(text) {
        const entries = loadJournal();
        entries.unshift({ text, ts: Date.now() });
        localStorage.setItem('fc_journal', JSON.stringify(entries.slice(0, 40)));
      }
      function fmtEntryDate(ts) {
        const d = new Date(ts);
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' · ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      }

      function openJournalWrite() {
        openImmersivePanel(`
          <div style="color:rgba(130,130,255,.2);font-size:9px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px;cursor:pointer;" id="journal-back">← Journal</div>
          <p style="color:rgba(196,148,78,.7);font-size:17px;line-height:1.75;text-align:center;font-style:italic;font-weight:300;margin-bottom:28px;margin-top:20px;">${DAILY_PROMPT}</p>
          <textarea id="iw-journal-text" style="width:100%;min-height:160px;background:rgba(255,255,255,.02);border:none;border-bottom:1px solid rgba(176,112,64,.14);padding:14px 0;color:#d8a060;font-size:15px;line-height:1.7;resize:none;outline:none;font-family:inherit;box-sizing:border-box;" placeholder="Write here…"></textarea>
          <div style="text-align:right;margin-top:16px;">
            <div id="iw-journal-save" style="display:inline-block;padding:9px 24px;border:1px solid rgba(176,112,64,.22);border-radius:20px;color:rgba(176,112,64,.6);font-size:10px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;">Save</div>
          </div>
        `, () => {
          const back = document.getElementById('journal-back');
          if (back) back.onclick = e => { e.stopPropagation(); openIntentionPanel('journal'); };
          const save = document.getElementById('iw-journal-save');
          if (save) save.onclick = e => {
            e.stopPropagation();
            const text = (document.getElementById('iw-journal-text').value || '').trim();
            if (text) { saveJournalEntry(text); }
            openIntentionPanel('journal');
          };
        });
      }

      const entries = loadJournal();
      openImmersivePanel(`
        <div style="color:rgba(176,112,64,.28);font-size:10px;letter-spacing:.22em;text-transform:uppercase;text-align:center;margin-bottom:24px;">Journal</div>
        <div style="text-align:center;margin-bottom:28px;">
          <div id="journal-new-btn" style="display:inline-block;padding:9px 28px;border:1px solid rgba(128,128,255,.28);border-radius:20px;color:rgba(128,128,255,.55);font-size:10px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;">+ New Entry</div>
        </div>
        ${entries.length === 0
          ? `<p style="color:rgba(176,112,64,.22);font-size:13px;text-align:center;line-height:1.8;font-style:italic;">Your journal is waiting.<br>Begin when you're ready.</p>`
          : entries.map(e => `
              <div style="padding:16px 0;border-bottom:1px solid rgba(176,112,64,.07);">
                <div style="color:rgba(176,112,64,.25);font-size:9px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px;">${fmtEntryDate(e.ts)}</div>
                <p style="color:rgba(200,144,78,.6);font-size:14px;line-height:1.7;margin:0;">${e.text.replace(/</g,'&lt;').replace(/\n/g,'<br>')}</p>
              </div>`).join('')
        }
      `, () => {
        const btn = document.getElementById('journal-new-btn');
        if (btn) btn.onclick = e => { e.stopPropagation(); openJournalWrite(); };
      });

    } else if (type === 'meditation') {
      openMeditationOverlay();
      return;

    } else if (type === 'commitments') {
      openImmersivePanel(`
        <div style="color:rgba(176,112,64,.28);font-size:10px;letter-spacing:.22em;text-transform:uppercase;text-align:center;margin-bottom:28px;">Commitments</div>
        <div style="color:rgba(176,112,64,.25);font-size:9px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:12px;">Gatherings</div>
        ${EVENTS.map(ev => {
          const rsvp = RSVP_STATES[ev.name];
          const dot = rsvp === 'going' ? 'rgba(100,200,100,.65)' : rsvp === 'maybe' ? 'rgba(200,170,60,.5)' : 'rgba(100,100,120,.3)';
          return `
          <div style="display:flex;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid rgba(176,112,64,.07);">
            <div style="text-align:center;min-width:32px;">
              <div style="color:#b07040;font-size:20px;font-weight:200;line-height:1;">${ev.day}</div>
              <div style="color:rgba(176,112,64,.28);font-size:8px;text-transform:uppercase;letter-spacing:.08em;">${ev.month}</div>
            </div>
            <div style="flex:1;">
              <div style="color:#d8a060;font-size:14px;">${ev.name}</div>
              <div style="color:rgba(176,112,64,.32);font-size:11px;margin-top:2px;">${ev.detail}</div>
            </div>
            <div style="color:rgba(176,112,64,.28);font-size:10px;letter-spacing:.08em;">${rsvp || '—'}</div>
            <div style="width:7px;height:7px;border-radius:50%;background:${dot};flex-shrink:0;"></div>
          </div>`;
        }).join('')}
        <div style="color:rgba(176,112,64,.25);font-size:9px;letter-spacing:.2em;text-transform:uppercase;margin-top:24px;margin-bottom:12px;">Pledges</div>
        ${PLEDGES.map((p, i) => {
          const done = PLEDGE_STATES[i];
          return `
          <div class="pledge-row" data-idx="${i}" style="display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid rgba(176,112,64,.07);cursor:pointer;">
            <div class="pledge-circle" style="width:15px;height:15px;border-radius:50%;flex-shrink:0;margin-top:3px;transition:all .25s;
              border:1px solid rgba(176,112,64,${done ? '0' : '.25'});
              background:${done ? 'rgba(100,200,100,.55)' : 'transparent'};
              display:flex;align-items:center;justify-content:center;font-size:9px;color:rgba(255,255,255,.8);">
              ${done ? '✓' : ''}
            </div>
            <div style="flex:1;">
              <div style="color:${done ? 'rgba(176,112,64,.35)' : '#d8a060'};font-size:14px;margin-bottom:2px;${done ? 'text-decoration:line-through;' : ''}">${p.text}</div>
              <div style="color:rgba(176,112,64,.32);font-size:11px;">${p.due}</div>

        <div id="pledge-add-row" style="display:flex;gap:12px;align-items:center;padding:16px 0;cursor:pointer;">

          <div style="color:rgba(176,112,64,.4);font-size:13px;letter-spacing:.06em;">Add a pledge</div>
        </div>
        <div id="pledge-add-form" style="display:none;padding-bottom:16px;">
          <input id="pledge-text" type="text" placeholder="I commit to…" style="width:100%;background:transparent;border:none;border-bottom:1px solid rgba(176,112,64,.18);padding:8px 0;color:#d8a060;font-size:14px;outline:none;font-family:inherit;box-sizing:border-box;margin-bottom:8px;">
          <input id="pledge-due" type="text" placeholder="By when?" style="width:100%;background:transparent;border:none;border-bottom:1px solid rgba(176,112,64,.12);padding:8px 0;color:rgba(200,144,78,.6);font-size:12px;outline:none;font-family:inherit;box-sizing:border-box;margin-bottom:16px;">
          <div style="text-align:right;"><div id="pledge-save" style="display:inline-block;padding:7px 20px;border:1px solid rgba(176,112,64,.22);border-radius:16px;color:rgba(176,112,64,.55);font-size:10px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;">Add</div></div>
        </div>
      `, () => {
        // Toggle pledge done state
        document.querySelectorAll('.pledge-row').forEach(row => {
          row.onclick = e => {
            e.stopPropagation();
            const idx = parseInt(row.dataset.idx);
            PLEDGE_STATES[idx] = !PLEDGE_STATES[idx];
            openIntentionPanel('commitments');
          };
        });
        // Add pledge form
        const addRow = document.getElementById('pledge-add-row');
        const addForm = document.getElementById('pledge-add-form');
        if (addRow && addForm) {
          addRow.onclick = e => {
            e.stopPropagation();
            addRow.style.display = 'none';
            addForm.style.display = 'block';
          };
        }
        const saveBtn = document.getElementById('pledge-save');
        if (saveBtn) saveBtn.onclick = e => {
          e.stopPropagation();
          const text = (document.getElementById('pledge-text').value || '').trim();
          const due  = (document.getElementById('pledge-due').value  || '').trim();
          if (text) { PLEDGES.push({ text, due: due || 'Ongoing' }); }
          openIntentionPanel('commitments');
        };
      });

    } else if (type === 'gratitude') {
      const GRATITUDE_LOG = window._gratitudeLog = window._gratitudeLog || [];
      const GRATITUDE_PROMPTS = [
        'What are you grateful for in this circle today?',
        'Who in the community has touched you recently?',
        'What does this land give you that you couldn\'t find alone?',
        'What moment from this week do you want to hold?',
        'What are you receiving right now, even quietly?',
      ];
      const prompt = GRATITUDE_PROMPTS[new Date().getDate() % GRATITUDE_PROMPTS.length];
      openImmersivePanel(`
        <div style="color:rgba(80,184,255,.22);font-size:9px;letter-spacing:.26em;text-transform:uppercase;text-align:center;margin-bottom:32px;">Gratitude</div>
        <p style="color:rgba(80,184,255,.5);font-size:18px;line-height:1.8;text-align:center;font-style:italic;font-weight:200;margin-bottom:32px;">${prompt}</p>
        <textarea id="grat-text" placeholder="What you're grateful for…" style="width:100%;min-height:130px;background:rgba(255,255,255,.02);border:none;border-bottom:1px solid rgba(80,184,255,.14);padding:12px 0;color:#d8a060;font-size:15px;line-height:1.7;resize:none;outline:none;font-family:inherit;box-sizing:border-box;"></textarea>
        <div style="text-align:right;margin-top:16px;margin-bottom:36px;">
          <div id="grat-save" style="display:inline-block;padding:9px 24px;border:1px solid rgba(80,184,255,.22);border-radius:20px;color:rgba(80,184,255,.5);font-size:10px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;">Offer</div>
        </div>
        ${GRATITUDE_LOG.length > 0 ? `

          ${GRATITUDE_LOG.slice(0,5).map(e => `
            <div style="padding:12px 0;border-bottom:1px solid rgba(80,184,255,.06);">

              <p style="color:rgba(200,144,78,.5);font-size:13px;line-height:1.7;font-style:italic;margin:0;">"${e.text.replace(/</g,'&lt;')}"</p>
            </div>`).join('')}
        ` : ''}
      `, () => {
        const save = document.getElementById('grat-save');
        if (save) save.onclick = e => {
          e.stopPropagation();
          const text = (document.getElementById('grat-text').value || '').trim();
          if (text) GRATITUDE_LOG.unshift({ text, ts: Date.now() });
          openIntentionPanel('gratitude');
        };
      });

    } else if (type === 'create') {
      const CREATE_PROMPTS = [
        'What wants to be made through you today?',
        'What are you in the middle of creating?',
        'What idea keeps returning to you?',
        'What would you make if fear stepped aside?',
        'What are your hands drawn to right now?',
      ];
      const todayPrompt = CREATE_PROMPTS[new Date().getDate() % CREATE_PROMPTS.length];
      openImmersivePanel(`
        <div style="color:rgba(255,152,64,.28);font-size:10px;letter-spacing:.22em;text-transform:uppercase;text-align:center;margin-bottom:32px;">Create</div>
        <p style="color:rgba(255,152,64,.55);font-size:19px;line-height:1.8;text-align:center;font-style:italic;font-weight:200;margin-bottom:32px;">${todayPrompt}</p>
        <textarea id="create-text" placeholder="Name what you're making…" style="width:100%;min-height:120px;background:rgba(255,255,255,.02);border:none;border-bottom:1px solid rgba(255,152,64,.14);padding:12px 0;color:#d8a060;font-size:15px;line-height:1.7;resize:none;outline:none;font-family:inherit;box-sizing:border-box;"></textarea>

        </div>
        ${CREATE_LOG.length > 0 ? `
          <div style="margin-top:36px;">
            <div style="color:rgba(255,152,64,.22);font-size:9px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px;">Recent creations</div>
            ${CREATE_LOG.slice(0,5).map(entry => `
