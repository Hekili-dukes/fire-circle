          if (text) { CREATE_LOG.unshift({ text, ts: Date.now() }); }
          openIntentionPanel('create');
        };
      });

    } else if (type === 'root') {
      const me = USERS.find(u => u.isMe);
      const sz = 64;
      openImmersivePanel(`
        <div style="color:rgba(255,104,104,.22);font-size:9px;letter-spacing:.26em;text-transform:uppercase;text-align:center;margin-bottom:32px;">Root</div>

        <div style="display:flex;justify-content:center;margin-bottom:24px;">
          <div style="width:${sz}px;height:${sz}px;border-radius:50%;overflow:hidden;border:1px solid rgba(255,104,104,.18);">${makeAvatarSvg(me, sz)}</div>
        </div>

        <div style="margin-bottom:20px;">
          <div style="color:rgba(255,104,104,.25);font-size:9px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px;">Name</div>
          <input id="root-name" type="text" value="${me.name}" style="width:100%;background:transparent;border:none;border-bottom:1px solid rgba(255,104,104,.18);padding:8px 0;color:#d8a060;font-size:20px;font-weight:200;outline:none;font-family:inherit;box-sizing:border-box;">
        </div>

        <div style="margin-bottom:20px;">
          <div style="color:rgba(255,104,104,.25);font-size:9px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px;">Role</div>
          <input id="root-role" type="text" value="${me.role || ''}" style="width:100%;background:transparent;border:none;border-bottom:1px solid rgba(255,104,104,.15);padding:8px 0;color:rgba(200,144,78,.7);font-size:14px;letter-spacing:.06em;outline:none;font-family:inherit;box-sizing:border-box;">
        </div>

        <div style="margin-bottom:20px;">
          <div style="color:rgba(255,104,104,.25);font-size:9px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px;">Bio</div>
          <textarea id="root-bio" style="width:100%;background:transparent;border:none;border-bottom:1px solid rgba(255,104,104,.12);padding:8px 0;color:rgba(200,144,78,.6);font-size:14px;line-height:1.7;outline:none;font-family:inherit;resize:none;min-height:72px;box-sizing:border-box;">${me.bio || ''}</textarea>
        </div>

        <div style="margin-bottom:36px;">
          <div style="color:rgba(255,104,104,.25);font-size:9px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px;">What I'm tending this season</div>
          <input id="root-intention" type="text" value="${me.intention || ''}" placeholder="One thing…" style="width:100%;background:transparent;border:none;border-bottom:1px solid rgba(255,104,104,.12);padding:8px 0;color:rgba(200,144,78,.5);font-size:14px;font-style:italic;outline:none;font-family:inherit;box-sizing:border-box;">
        </div>

        <div style="text-align:center;">
          <div id="root-save-btn" style="display:inline-block;padding:11px 36px;border:1px solid rgba(255,104,104,.2);border-radius:24px;color:rgba(255,104,104,.45);font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all .2s;">Save</div>
        </div>
      `, () => {
        const saveBtn = document.getElementById('root-save-btn');
        if (!saveBtn) return;
        saveBtn.onclick = e => {
          e.stopPropagation();
          const name      = (document.getElementById('root-name').value      || '').trim();
          const role      = (document.getElementById('root-role').value      || '').trim();
          const bio       = (document.getElementById('root-bio').value       || '').trim();
          const intention = (document.getElementById('root-intention').value || '').trim();
          if (name) me.name = name;
          if (role) me.role = role;
          if (bio)  me.bio  = bio;
          me.intention = intention;
          // Reflect name change in avatar label on home screen
          document.querySelectorAll('.avatar-label').forEach(el => {
            if (el.textContent === me.name || name) {
              const wrap = el.closest('.avatar');
              if (wrap) {
                const circle = wrap.querySelector('.avatar-circle.me');
                if (circle) el.textContent = name || me.name;
              }
            }
          });
          saveBtn.textContent = 'Saved ✓';
          saveBtn.style.opacity = '.4';
          saveBtn.style.pointerEvents = 'none';
          setTimeout(() => closeImmersivePanel(), 800);
        };
      });
    }
  }

  // ── MEDITATION IMMERSIVE OVERLAY ──────────────────────────────────────
  (function() {
    // Breath cycle: 4s inhale · 4s hold · 6s exhale  (14s total)
    const INHALE = 4, HOLD = 4, EXHALE = 6, CYCLE = INHALE + HOLD + EXHALE;

    let medRunning   = false;
    let medRAF       = null;
    let medInterval  = null;
    let medTotalSecs = 10 * 60;
    let medRemaining = medTotalSecs;
    let medStartTime = null;   // performance.now() when session started

    function fmtTime(s) {
      const m = Math.floor(s / 60);
      return `${m}:${(s % 60).toString().padStart(2,'0')}`;
    }

    function setCue(text, op) {
      const el = document.getElementById('med-cue');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(() => { if (el) { el.textContent = text; el.style.opacity = op || '1'; } }, 400);
    }

    function animateOrb(ts) {
      if (!medRunning) return;
      const elapsed = (ts - medStartTime) / 1000;
      const phase   = elapsed % CYCLE;

      let scale, glowOp, cueText, orbOp;

      if (phase < INHALE) {
        // Inhale — orb grows
        const t = phase / INHALE;
        scale  = 1 + 0.44 * easeInOut(t);
        glowOp = 0.22 + 0.28 * t;
        orbOp  = 0.9 + 0.1 * t;
        cueText = 'breathe in';
      } else if (phase < INHALE + HOLD) {
        // Hold — orb full, steady glow
        scale  = 1.44;
        glowOp = 0.5;
        orbOp  = 1;
        cueText = 'hold';
      } else {
        // Exhale — orb shrinks
        const t = (phase - INHALE - HOLD) / EXHALE;
        scale  = 1.44 - 0.44 * easeInOut(t);
        glowOp = 0.5 - 0.28 * t;
        orbOp  = 1 - 0.1 * t;
        cueText = 'breathe out';
      }

      const orb  = document.getElementById('med-orb');
      const ring = document.getElementById('med-ring');
      if (orb) {
        orb.style.transform   = `scale(${scale.toFixed(3)})`;
        orb.style.boxShadow   = `0 0 ${(28 + 40 * glowOp).toFixed(0)}px ${(8 + 14 * glowOp).toFixed(0)}px rgba(160,110,255,${glowOp.toFixed(2)}), 0 0 80px 28px rgba(140,90,255,${(glowOp * 0.5).toFixed(2)})`;
        orb.style.opacity     = orbOp.toFixed(3);
      }
      if (ring) {
        ring.style.transform  = `scale(${(1 + 0.28 * (scale - 1)).toFixed(3)})`;
        ring.style.boxShadow  = `0 0 0 1px rgba(196,160,255,${(glowOp * 0.5).toFixed(2)})`;
      }

      // Update cue text on phase boundary (only when it changes)
      const cueEl = document.getElementById('med-cue');
      if (cueEl && cueEl._lastCue !== cueText) {
        cueEl._lastCue = cueText;
        setCue(cueText);
      }

      medRAF = requestAnimationFrame(animateOrb);
    }

    function easeInOut(t) {
      return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    }

    function startMed() {
      if (medRunning) return;
      medRunning  = true;
      medStartTime = performance.now();

      // Fade out duration row
      const row = document.getElementById('med-dur-row');
      if (row) row.style.opacity = '0';

      // Show timer
      const timer = document.getElementById('med-timer');
      if (timer) { timer.textContent = fmtTime(medRemaining); timer.style.opacity = '1'; }

      // Start breath animation
      medRAF = requestAnimationFrame(animateOrb);

      // Countdown
      medInterval = setInterval(() => {
        medRemaining--;
        const timer = document.getElementById('med-timer');
        if (timer) timer.textContent = fmtTime(medRemaining);
        if (medRemaining <= 0) {
          closeMeditationOverlay();
        }
      }, 1000);
    }

    function closeMeditationOverlay() {
      medRunning = false;
      if (medRAF)      { cancelAnimationFrame(medRAF); medRAF = null; }
      if (medInterval) { clearInterval(medInterval); medInterval = null; }

      const overlay = document.getElementById('med-overlay');
      if (!overlay) return;
      overlay.style.opacity = '0';
      overlay.style.background = 'rgba(1,3,2,0)';
      setTimeout(() => {
        overlay.style.pointerEvents = 'none';
        // Reset orb
        const orb  = document.getElementById('med-orb');
        const ring = document.getElementById('med-ring');
        if (orb)  { orb.style.transform = 'scale(1)'; orb.style.opacity = '1'; }
        if (ring) { ring.style.transform = 'scale(1)'; }
        // Reset cue
        const cue = document.getElementById('med-cue');
        if (cue)  { cue.textContent = 'tap to begin'; cue._lastCue = ''; cue.style.opacity = '1'; }
        // Reset timer opacity for next open
        const timer = document.getElementById('med-timer');
        if (timer) timer.style.opacity = '0.15';
        // Reset dur row
        const row = document.getElementById('med-dur-row');
        if (row) row.style.opacity = '1';
      }, 800);
    }

    window.openMeditationOverlay = function() {
      // Reset state
      medRunning   = false;
      medRemaining = medTotalSecs;
      if (medRAF)      { cancelAnimationFrame(medRAF); medRAF = null; }
      if (medInterval) { clearInterval(medInterval); medInterval = null; }

      const overlay = document.getElementById('med-overlay');
      if (!overlay) return;

      // Reset visuals
      const orb   = document.getElementById('med-orb');
      const ring  = document.getElementById('med-ring');
      const cue   = document.getElementById('med-cue');
      const timer = document.getElementById('med-timer');
      const row   = document.getElementById('med-dur-row');
      if (orb)  { orb.style.transform = 'scale(1)'; orb.style.opacity = '1'; orb.style.transition = 'none'; }
      if (ring) { ring.style.transform = 'scale(1)'; ring.style.transition = 'none'; }
      if (cue)  { cue.textContent = 'tap to begin'; cue._lastCue = ''; cue.style.opacity = '1'; }
      if (timer){ timer.textContent = fmtTime(medTotalSecs); timer.style.opacity = '0.15'; }
      if (row)  { row.style.opacity = '1'; }

      // Duration pills
      overlay.querySelectorAll('.med-dur-pill').forEach(pill => {
        const active = parseInt(pill.dataset.min) === medTotalSecs / 60;
        pill.style.borderColor = active ? 'rgba(196,160,255,.55)' : 'rgba(196,160,255,.2)';
        pill.style.color       = active ? 'rgba(196,160,255,.85)' : 'rgba(196,160,255,.4)';
        pill.onclick = e => {
          e.stopPropagation();
          if (medRunning) return;
          medTotalSecs = medRemaining = parseInt(pill.dataset.min) * 60;
          if (timer) timer.textContent = fmtTime(medRemaining);
          overlay.querySelectorAll('.med-dur-pill').forEach(p => {
            const a = parseInt(p.dataset.min) === medTotalSecs / 60;
            p.style.borderColor = a ? 'rgba(196,160,255,.55)' : 'rgba(196,160,255,.2)';
            p.style.color       = a ? 'rgba(196,160,255,.85)' : 'rgba(196,160,255,.4)';
          });
        };
      });

      // Tap orb wrap to begin
      const orbWrap = document.getElementById('med-orb-wrap');
      if (orbWrap) {
        orbWrap.style.cursor = 'pointer';
        orbWrap.onclick = e => { e.stopPropagation(); startMed(); };
      }

      // Tap overlay background (not orb or pills) to close when running
      overlay.onclick = e => {
        if (e.target === overlay || e.target === document.getElementById('med-close-hint')) {
          closeMeditationOverlay();
        }
      };

      // Restore transitions after a tick
      setTimeout(() => {
        if (orb)  orb.style.transition  = 'transform .25s ease, box-shadow .25s ease, opacity .6s ease';
        if (ring) ring.style.transition = 'transform .25s ease, box-shadow .25s ease';
      }, 50);

      // Reveal overlay
      overlay.style.pointerEvents = 'all';
      overlay.getBoundingClientRect();
      overlay.style.opacity    = '1';
      overlay.style.background = 'rgba(1,3,2,0.93)';
    };
  })();

  function openCosmicPanel(type) {
    if (type === 'events') {
      openImmersivePanel(`
        <div style="color:rgba(176,112,64,.28);font-size:10px;letter-spacing:.22em;text-transform:uppercase;text-align:center;margin-bottom:28px;">Nearby Events</div>
        ${EVENTS.map(ev => `
          <div style="display:flex;gap:18px;align-items:flex-start;padding:16px 0;border-bottom:1px solid rgba(176,112,64,.07);">
            <div style="min-width:36px;text-align:center;">
              <div style="color:#b07040;font-size:26px;font-weight:200;line-height:1;">${ev.day}</div>
              <div style="color:rgba(176,112,64,.28);font-size:9px;text-transform:uppercase;letter-spacing:.1em;">${ev.month}</div>
            </div>
            <div>
              <div style="color:#d8a060;font-size:15px;margin-bottom:4px;">${ev.name}</div>
              <div style="color:rgba(176,112,64,.32);font-size:12px;">${ev.detail}</div>
            </div>
          </div>`).join('')}
      `);

    } else if (type === 'meetup') {
      const others = USERS.filter(u => !u.isMe);
      const suggestion = others[Math.floor(Math.random() * others.length)];
      const sz = 60;
      openImmersivePanel(`
        <div style="color:rgba(176,112,64,.28);font-size:10px;letter-spacing:.22em;text-transform:uppercase;text-align:center;margin-bottom:6px;">Someone to Meet</div>
        <div style="color:rgba(176,112,64,.16);font-size:9px;text-align:center;margin-bottom:28px;letter-spacing:.1em;">You haven't connected in a while</div>
        <div style="display:flex;align-items:flex-start;gap:18px;margin-bottom:32px;">
          <div style="width:${sz}px;height:${sz}px;border-radius:50%;border:1px solid rgba(176,112,64,.2);overflow:hidden;flex-shrink:0;">${makeAvatarSvg(suggestion, sz)}</div>
          <div>
            <div style="color:#d8a060;font-size:18px;margin-bottom:4px;">${suggestion.name}</div>
            <div style="color:rgba(176,112,64,.3);font-size:9px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:10px;">${suggestion.role}</div>
            <div style="color:rgba(200,144,78,.6);font-size:13px;line-height:1.65;">${suggestion.bio}</div>
          </div>
        </div>
        <div style="text-align:center;">
          <div style="display:inline-block;padding:11px 32px;border:1px solid rgba(176,112,64,.22);border-radius:24px;color:rgba(176,112,64,.55);font-size:10px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;">Send a Message</div>
        </div>
      `);

    } else if (type === 'gathering') {
      openImmersivePanel(`
        <div style="color:rgba(176,112,64,.28);font-size:10px;letter-spacing:.22em;text-transform:uppercase;text-align:center;margin-bottom:28px;">Open Gatherings</div>
        ${[
          { name: 'Morning Circle',      detail: 'Daily · Sunrise · Fire Pit',       open: true  },
          { name: 'Communal Dinner',     detail: 'Tonight · 6pm · Main Hall',         open: true  },
          { name: 'Work Party — Garden', detail: 'Saturday · 8am · Lower Field',      open: true  },
          { name: 'Story Night',         detail: 'Friday · 7pm · 4 spots remaining',  open: false },
        ].map(g => `
          <div style="display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid rgba(176,112,64,.07);">
            <div style="width:7px;height:7px;border-radius:50%;background:${g.open ? 'rgba(100,200,100,.55)' : 'rgba(200,150,60,.4)'};flex-shrink:0;"></div>
            <div style="flex:1;">
              <div style="color:#d8a060;font-size:15px;margin-bottom:3px;">${g.name}</div>
              <div style="color:rgba(176,112,64,.3);font-size:12px;">${g.detail}</div>
            </div>
            <div style="color:rgba(176,112,64,.22);font-size:20px;">›</div>
          </div>`).join('')}
      `);

    } else if (type === 'ohana') {
      const suggestions = COMMUNITIES.filter(c => !c.isMe).slice(0, 3);
      openImmersivePanel(`
        <div style="color:rgba(176,112,64,.28);font-size:10px;letter-spacing:.22em;text-transform:uppercase;text-align:center;margin-bottom:6px;">Explore a New Ohana</div>
        <div style="color:rgba(176,112,64,.16);font-size:9px;text-align:center;margin-bottom:28px;letter-spacing:.1em;">Communities that share your values</div>
        ${suggestions.map(c => `
          <div style="padding:18px 0;border-bottom:1px solid rgba(176,112,64,.07);">
            <div style="color:#d8a060;font-size:15px;margin-bottom:5px;">${c.name}</div>
            <div style="color:rgba(176,112,64,.38);font-size:12px;line-height:1.6;margin-bottom:8px;">${c.desc}</div>
            <div style="color:rgba(176,112,64,.22);font-size:9px;letter-spacing:.14em;text-transform:uppercase;">${c.members} members</div>
          </div>`).join('')}
      `);
    }
  }

  function openPage(id) {
    if (id === 'innerwork') buildInnerwork();
    const el = document.getElementById(id);
    el.style.opacity = '1';
    el.style.pointerEvents = 'all';
  }

  function closePage(id) {
    const el = document.getElementById(id);
    el.style.opacity = '0';
    el.style.pointerEvents = 'none';
  }


  // ── INIT ──────────────────────────────────────────────────────────────
  layout();
  // Discovery navigation is handled by #outer-tap click in layout()

  document.getElementById('disc-close').onclick = transitionFromDiscovery;

  // Tapping discovery background closes immersive panel if open
  document.getElementById('discovery').addEventListener('click', () => {
    const ip = document.getElementById('immersive-panel');
    if (ip && ip.style.pointerEvents === 'all') closeImmersivePanel();
  });

  window.addEventListener('resize', () => {
    layout();
    if (document.getElementById('discovery').classList.contains('visible')) buildDiscovery();
  });

  // ── UNIVERSAL IMMERSIVE PANEL ─────────────────────────────────────────
  (function() {
    let _onReady = null;

    window.openImmersivePanel = function(html, onReady) {
      _onReady = onReady || null;
      const panel = document.getElementById('immersive-panel');
      const content = document.getElementById('imp-content');
      content.innerHTML = html;
      panel.style.pointerEvents = 'all';
      panel.getBoundingClientRect();
      panel.style.opacity = '1';
      panel.style.background = 'rgba(1,4,2,0.95)';
      if (_onReady) { setTimeout(_onReady, 20); }
    };

    window.closeImmersivePanel = function() {
      const panel = document.getElementById('immersive-panel');
      panel.style.opacity = '0';
      panel.style.background = 'rgba(1,4,2,0)';
      setTimeout(() => {
        panel.style.pointerEvents = 'none';
        document.getElementById('imp-content').innerHTML = '';
      }, 700);
    };

    // Script is at end of body — DOM already ready
    const _impPanel = document.getElementById('immersive-panel');
    _impPanel.addEventListener('click', e => {
      if (e.target === _impPanel || e.target === document.getElementById('imp-close-hint')) {
        closeImmersivePanel();
      }
    });
  })();

</script>
